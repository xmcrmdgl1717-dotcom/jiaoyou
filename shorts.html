<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>嗨呀直播 · 全部视频</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  
  .header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #f0f0f0;
  }
  .header h1 { font-size: 18px; font-weight: 800; color: #1f2551; }
  .back-btn {
    font-size: 13px; color: #ff3d8b; font-weight: 600; text-decoration: none;
    padding: 6px 14px; border-radius: 20px; background: #fff0f5;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px; 
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16; 
    background: #f5f5f5;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .card img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }

  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 30px 6px 6px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
    color: #fff; pointer-events: none;
  }
  .card-title {
    font-size: 11px; font-weight: 600; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 4px; word-break: break-all;
  }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; opacity: 0.9;
  }

  .live-tag {
    position: absolute; top: 4px; left: 4px;
    background: #ff3b5c; color: #fff; font-size: 8px; font-weight: 700;
    padding: 2px 4px; border-radius: 4px; z-index: 2;
  }

  #sentinel {
    text-align: center; padding: 24px 0; font-size: 12px; color: #999;
  }

  /* ================= 视频播放弹窗 ================= */
  #player-modal {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: none; align-items: center; justify-content: center;
  }
  #player-modal.active { display: flex; }
  
  .player-box { position: relative; width: 100%; height: 100%; max-width: 480px; }
  
  .close-btn {
    position: absolute; top: 20px; left: 20px; z-index: 20;
    background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #video-el { width: 100%; height: 100%; object-fit: contain; }
  
  /* 🔴 试看结束遮罩 - 深度黑化+毛玻璃 */
  .limit-mask {
    position: absolute; inset: 0; 
    background: rgba(0, 0, 0, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 30;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
  }
  .limit-mask h3 { color: #ff6b9d; font-size: 20px; margin-bottom: 10px; }
  .limit-mask button {
    background: linear-gradient(90deg, #ff9a4d, #ff4d94); color: #fff;
    border: none; padding: 10px 30px; border-radius: 20px;
    margin-top: 20px; font-weight: bold;
  }
</style>
</head>
<body>

<header class="header">
  <h1>🔥 精彩视频</h1>
  <a href="index.html" class="back-btn">← 返回首页</a>
</header>

<div class="grid-container" id="grid"></div>
<div id="sentinel">正在获取数据...</div>

<div id="player-modal">
  <div class="player-box">
    <button class="close-btn" id="close-btn">×</button>
    <video id="video-el" controls playsinline></video>
    <div class="limit-mask" id="limit-mask">
      <h3>试看已结束</h3>
      <p style="font-size:13px; opacity:0.8;">注册登录后可无限畅看完整版</p>
      <button onclick="window.location.href='index.html'">去首页注册</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://jiaoyouweb.onrender.com';
  const grid = document.getElementById('grid');
  const sentinel = document.getElementById('sentinel');

  let allVideos = [];      
  let renderedIndex = 0;   
  
  const INITIAL_SIZE = 12; // 首屏加载12个填满屏幕
  const LOAD_MORE_SIZE = 9; // 后续每次加载9个
  
  let isLoading = false;
  let hasMore = false;     
  let isInitialLoaded = false;

  function parseUrl(urlStr) {
    if (!urlStr) return '';
    if (urlStr.includes('$')) {
      const parts = urlStr.split('#');
      if (parts.length > 0 && parts[0].includes('$')) return parts[0].split('$')[1];
    }
    return urlStr;
  }

  function createCard(video) {
    const src = parseUrl(video.playUrl);
    const pic = video.pic || 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=400&q=80';
    const title = video.name.length > 20 ? video.name.substring(0, 20) + '...' : video.name;
    const hot = (Math.random() * 5 + 1).toFixed(1);

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${pic}" referrerpolicy="no-referrer" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=400&q=80'">
      <span class="live-tag">LIVE</span>
      <div class="card-info">
        <div class="card-title">${title}</div>
        <div class="card-meta">
          <span>📍 ${video.category || '同城'}</span>
          <span>🔥 ${hot}K</span>
        </div>
      </div>
    `;
    div.onclick = () => openPlayer(src, title, video.category);
    return div;
  }

  function loadBatch(count) {
    if (isLoading || !hasMore) return;
    isLoading = true;
    sentinel.textContent = '正在加载...';

    setTimeout(() => {
      const nextVideos = allVideos.slice(renderedIndex, renderedIndex + count);
      
      if (nextVideos.length === 0) {
        hasMore = false;
        sentinel.textContent = '已经到底啦，没有更多视频了~';
        isLoading = false;
        return;
      }

      const fragment = document.createDocumentFragment();
      nextVideos.forEach(v => fragment.appendChild(createCard(v)));
      
      grid.appendChild(fragment);
      renderedIndex += nextVideos.length;
      isLoading = false;

      if (renderedIndex >= allVideos.length) {
        hasMore = false;
        sentinel.textContent = '已经到底啦，没有更多视频了~';
      } else {
        sentinel.textContent = '上滑加载更多...';
      }
    }, 200); 
  }

  function init() {
    fetch(`${API_BASE}/api/videos`)
      .then(res => res.json())
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          sentinel.textContent = '暂无视频数据，请前往后台采集';
          return;
        }
        
        allVideos = data;
        hasMore = true; 
        loadBatch(INITIAL_SIZE); 
        isInitialLoaded = true;
      })
      .catch(err => {
        console.error('拉取失败:', err);
        sentinel.textContent = '网络错误，请刷新重试';
      });
  }

  let scrollTimeout = null;
  window.addEventListener('scroll', () => {
    if (!isInitialLoaded || isLoading || !hasMore) return;
    if (scrollTimeout) return;

    scrollTimeout = setTimeout(() => {
      scrollTimeout = null;
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;

      if (documentHeight - scrollTop - windowHeight < 300) {
        loadBatch(LOAD_MORE_SIZE); 
      }
    }, 100); 
  });

  let hls = null;
  const playerModal = document.getElementById('player-modal');
  const videoEl = document.getElementById('video-el');
  const limitMask = document.getElementById('limit-mask');
  let limitHandler = null;

  function openPlayer(src, title, category) {
    if (!src) return alert('视频源无效');
    limitMask.style.display = 'none';
    playerModal.classList.add('active');
    document.body.style.overflow = 'hidden';

    if (src.includes('.m3u8') && window.Hls && Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(videoEl);
    } else {
      videoEl.src = src;
    }
    
    videoEl.play().catch(e => console.log('播放失败:', e));

    const isLogin = !!localStorage.getItem('hiya_user');
    if (!isLogin) {
      if (limitHandler) videoEl.removeEventListener('timeupdate', limitHandler);
      limitHandler = () => {
        if (videoEl.currentTime >= 15 && limitMask.style.display !== 'flex') {
          videoEl.pause();
          limitMask.style.display = 'flex';
        }
      };
      videoEl.addEventListener('timeupdate', limitHandler);
    }
  }

  document.getElementById('close-btn').onclick = () => {
    playerModal.classList.remove('active');
    document.body.style.overflow = '';
    if (hls) { hls.destroy(); hls = null; }
    if (limitHandler) { videoEl.removeEventListener('timeupdate', limitHandler); }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
  };

  init();
</script>
</body>
</html>
