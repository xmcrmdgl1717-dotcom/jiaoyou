<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>嗨呀直播 · 全部视频</title>
<!-- 引入 HLS.js 支持 m3u8 视频流播放 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  /* ================= 彻底重置页面样式，摆脱全局污染 ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    background: #ffffff; /* 纯白背景，更干净 */
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  
  /* 顶部悬浮导航栏 */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #f0f0f0;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 800;
    color: #1f2551;
  }
  .back-btn {
    font-size: 13px;
    color: #ff3d8b;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 20px;
    background: #fff0f5;
  }

  /* 🔴 核心瀑布流布局 */
  .grid-container {
    display: grid;
    /* 严格保证一行 3 个，平分屏幕宽度 */
    grid-template-columns: repeat(3, 1fr);
    gap: 2px; /* 极小的间距，让内容更饱满 */
    width: 100%;
    max-width: 800px; /* PC端居中最大宽度 */
    margin: 0 auto;
  }

  /* 卡片 - 严格 9:16 竖屏长图比例 */
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16; 
    background: #f5f5f5;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 图片完全覆盖 */
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 卡片底部信息（渐变遮罩） */
  .card-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 30px 6px 6px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
    color: #fff;
    pointer-events: none;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2; /* 最多显示两行，防止文字太长撑爆 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    opacity: 0.9;
  }

  /* LIVE 角标 */
  .live-tag {
    position: absolute;
    top: 4px;
    left: 4px;
    background: #ff3b5c;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 4px;
    z-index: 2;
  }

  /* 底部加载提示 */
  #sentinel {
    text-align: center;
    padding: 20px 0;
    font-size: 12px;
    color: #999;
  }

  /* ================= 视频播放弹窗 ================= */
  #player-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #player-modal.active { display: flex; }
  
  .player-box {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px; /* 限制横屏时的宽度 */
  }
  .close-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    background: rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    font-size: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video-el {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .limit-mask {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
  }
  .limit-mask h3 { color: #ff6b9d; font-size: 20px; margin-bottom: 10px; }
  .limit-mask button {
    background: linear-gradient(90deg, #ff9a4d, #ff4d94);
    color: #fff;
    border: none;
    padding: 10px 30px;
    border-radius: 20px;
    margin-top: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="header">
  <h1>🔥 精彩视频</h1>
  <a href="index.html" class="back-btn">← 返回首页</a>
</header>

<!-- 瀑布流容器 -->
<div class="grid-container" id="grid"></div>

<!-- 触底监听哨兵 -->
<div id="sentinel">正在加载数据...</div>

<!-- 视频播放弹窗 -->
<div id="player-modal">
  <div class="player-box">
    <button class="close-btn" id="close-btn">×</button>
    <video id="video-el" controls playsinline></video>
    <div class="limit-mask" id="limit-mask">
      <h3>试看已结束</h3>
      <p style="font-size:13px; opacity:0.8;">注册登录后可无限畅看完整版</p>
      <button onclick="window.location.href='index.html'">去首页注册</button>
    </div>
  </div>
</div>

<script>
  // 你的后端地址
  const API_BASE = 'https://jiaoyouweb.onrender.com';
  
  const grid = document.getElementById('grid');
  const sentinel = document.getElementById('sentinel');

  let allVideos = [];      // 所有拉取下来的数据
  let renderedIndex = 0;   // 当前已渲染到的索引
  const BATCH_SIZE = 3;    // 🔴 核心：每次只加载 3 个
  let isLoading = false;
  let hasMore = true;

  // 解析苹果CMS播放地址
  function parseUrl(urlStr) {
    if (!urlStr) return '';
    if (urlStr.includes('$')) {
      const parts = urlStr.split('#');
      if (parts.length > 0 && parts[0].includes('$')) return parts[0].split('$')[1];
    }
    return urlStr;
  }

  // 创建卡片 HTML
  function createCard(video) {
    const src = parseUrl(video.playUrl);
    const pic = video.pic || 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=400&q=80';
    // 截断过长的标题
    const title = video.name.length > 20 ? video.name.substring(0, 20) + '...' : video.name;
    
    // 随机生成一个热度值
    const hot = (Math.random() * 5 + 1).toFixed(1);

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${pic}" referrerpolicy="no-referrer" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=400&q=80'">
      <span class="live-tag">LIVE</span>
      <div class="card-info">
        <div class="card-title">${title}</div>
        <div class="card-meta">
          <span>📍 ${video.category || '同城'}</span>
          <span>🔥 ${hot}K</span>
        </div>
      </div>
    `;
    
    // 绑定点击播放
    div.onclick = () => openPlayer(src, title, video.category);
    return div;
  }

  // 渲染下一批数据（每次3个）
  function loadNextBatch() {
    if (isLoading || !hasMore) return;
    
    isLoading = true;
    sentinel.textContent = '正在加载...';

    // 模拟一点点网络延迟，让加载动画更自然
    setTimeout(() => {
      const nextVideos = allVideos.slice(renderedIndex, renderedIndex + BATCH_SIZE);
      
      if (nextVideos.length === 0) {
        hasMore = false;
        sentinel.textContent = '已经到底啦，没有更多视频了~';
        isLoading = false;
        return;
      }

      const fragment = document.createDocumentFragment();
      nextVideos.forEach(v => fragment.appendChild(createCard(v)));
      
      grid.appendChild(fragment);
      renderedIndex += nextVideos.length;
      isLoading = false;

      if (renderedIndex >= allVideos.length) {
        hasMore = false;
        sentinel.textContent = '已经到底啦，没有更多视频了~';
      } else {
        sentinel.textContent = '上滑加载更多...';
      }
    }, 200); 
  }

  // 初始化拉取数据
  function init() {
    fetch(`${API_BASE}/api/videos`)
      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) {
          sentinel.textContent = '暂无视频，请去后台采集';
          return;
        }
        allVideos = data;
        loadNextBatch(); // 先渲染前 3 个
      })
      .catch(err => {
        sentinel.textContent = '网络错误，加载失败';
      });
  }

  // 🔴 核心缓加载逻辑：使用 IntersectionObserver 监听底部哨兵
  // 只要底部哨兵出现在视口内，就触发加载
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !isLoading && hasMore) {
      loadNextBatch();
    }
  }, { rootMargin: '100px' }); // 提前 100px 触发，体验无缝

  observer.observe(sentinel);

  // ================= 视频播放逻辑 =================
  let hls = null;
  const playerModal = document.getElementById('player-modal');
  const videoEl = document.getElementById('video-el');
  const limitMask = document.getElementById('limit-mask');
  let limitHandler = null;

  function openPlayer(src, title, category) {
    if (!src) return alert('视频源无效');
    
    limitMask.style.display = 'none';
    playerModal.classList.add('active');
    document.body.style.overflow = 'hidden'; // 禁止背景滚动

    if (src.includes('.m3u8') && window.Hls && Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(videoEl);
    } else {
      videoEl.src = src;
    }
    
    videoEl.play().catch(e => console.log('播放失败:', e));

    // 登录限制检查
    const isLogin = !!localStorage.getItem('hiya_user');
    if (!isLogin) {
      if (limitHandler) videoEl.removeEventListener('timeupdate', limitHandler);
      limitHandler = () => {
        // 超过 15 秒停止并显示遮罩
        if (videoEl.currentTime >= 15 && limitMask.style.display !== 'flex') {
          videoEl.pause();
          limitMask.style.display = 'flex';
        }
      };
      videoEl.addEventListener('timeupdate', limitHandler);
    }
  }

  document.getElementById('close-btn').onclick = () => {
    playerModal.classList.remove('active');
    document.body.style.overflow = '';
    if (hls) { hls.destroy(); hls = null; }
    if (limitHandler) { videoEl.removeEventListener('timeupdate', limitHandler); }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
  };

  // 启动
  init();
</script>
</body>
</html>
