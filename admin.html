<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS 管理后台</title>
    <style>
        /* 样式完全保留你原本的 */
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; color: var(--primary); border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 30px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab { display: none; } .tab.active { display: block; }
        .card { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h3 { margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; word-break: break-all; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline:none; }
        button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; } .btn-danger { background: #dc3545; } .btn-text { background: none; color: #1890ff; padding: 0; font-size: 13px; margin-right: 10px;}
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index:999; }
        .modal-box { background: #fff; padding: 20px; width: 90%; max-width: 600px; border-radius: 8px; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 20px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
        .progress-bar-container { display: none; width: 100%; height: 12px; background: #eee; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px; }
        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; max-height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 8px;}
        .lang-checkbox { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
        .action-btns { display: flex; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CMS System</div>
        <div class="nav-item active" onclick="switchTab('tab-collect', this)">📥 采集视频</div>
        <div class="nav-item" onclick="switchTab('tab-category', this)">🗂 视频分类管理</div>
        <div class="nav-item" onclick="switchTab('tab-config', this)">⚙️ 系统配置</div>
        <div class="nav-item" onclick="switchTab('tab-upload', this)">📤 视频上传管理</div>
        <div class="nav-item" onclick="switchTab('tab-i18n', this)">🌍 全局语言</div>
        <div class="nav-item" onclick="switchTab('tab-user', this)">👤 用户管理</div>
        <div class="nav-item" onclick="switchTab('tab-order', this)">💳 支付订单</div>
    </div>
    <div class="main">
        <div class="header"><h2 id="page-title">采集视频</h2><button class="btn-secondary" onclick="location.reload()">退出</button></div>
        <div class="content">
            
            <!-- 采集、分类、系统配置、上传、多语言等代码原样保留 (为节省篇幅，这里折叠，请直接使用你原来的HTML结构) -->
            <div id="tab-collect" class="tab active">
                <div class="card">
                    <h3>资源站列表</h3>
                    <div id="site-list"></div>
                    <div class="flex" style="margin-top:15px; background:#fafafa; padding:15px;">
                        <input type="text" id="site-name" placeholder="名称">
                        <input type="text" id="site-url" placeholder="接口地址" style="flex:1;">
                        <select id="site-type"><option value="json">JSON</option><option value="xml">XML</option></select>
                        <button onclick="addSite()">添加</button>
                    </div>
                </div>
                <div id="bind-panel" class="card" style="display:none;">
                    <h3>分类绑定 <button class="btn-secondary" onclick="document.getElementById('bind-panel').style.display='none'">关闭</button></h3>
                    <table><thead><tr><th>源分类</th><th>绑定到本地</th></tr></thead><tbody id="bind-tbody"></tbody></table>
                    <button style="margin-top:10px;" onclick="saveBindings()">保存绑定</button>
                </div>
                <div class="card">
                    <h3>执行采集</h3>
                    <div class="flex">
                        <select id="collect-site-select" style="width:300px;"></select>
                        <button onclick="startCollect()">一键采集</button>
                        <span id="collect-status" style="color:green;"></span>
                    </div>
                </div>
            </div>
            <!-- ...省略中间原样保留代码... -->

            <!-- 🔴 用户与订单 修改区 -->
            <div id="tab-user" class="tab">
                <div class="card">
                    <h3>用户列表</h3>
                    <div class="flex" style="margin-bottom: 15px;">
                        <input type="text" id="user-search" placeholder="搜索邮箱或昵称..." oninput="filterUsers()" style="flex:1;">
                    </div>
                    <table>
                        <thead><tr><th>用户ID</th><th>邮箱</th><th>昵称</th><th>余额</th><th>注册时间</th><th>操作</th></tr></thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </div>
            <div id="tab-order" class="tab">
                <div class="card">
                    <h3>订单管理</h3>
                    <div class="flex" style="margin-bottom: 15px;">
                        <input type="text" id="order-search" placeholder="搜索订单号/视频/邮箱..." oninput="filterOrders()" style="flex:1;">
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>订单 / 购买项目</th>
                                <th>用户 (邮箱)</th>
                                <th>金额</th>
                                <th>状态 / Hash</th>
                                <th>时间 (创建 / 确认)</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="order-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗集合 -->
    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3 id="edit-title">编辑字典</h3>
            <textarea id="edit-content" style="width:100%; height:300px; font-family:monospace;"></textarea>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('edit-modal').style.display='none'">取消</button>
                <button onclick="saveDict()">保存</button>
            </div>
        </div>
    </div>

    <div id="generic-modal" class="modal">
        <div class="modal-box" style="max-width: 400px;">
            <h3 id="gm-title">编辑</h3>
            <div id="gm-content"></div>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('generic-modal').style.display='none'">取消</button>
                <button onclick="saveGeneric()">保存</button>
            </div>
        </div>
    </div>

    <div id="lang-modal" class="modal">
        <div class="modal-box">
            <h3>添加国家语言 (勾选后添加)</h3>
            <div class="lang-grid" id="lang-grid"></div>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('lang-modal').style.display='none'">取消</button>
                <button onclick="confirmAddLangs()">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 订单审核弹窗 -->
    <div id="order-modal" class="modal">
        <div class="modal-box" style="max-width: 400px;">
            <h3>订单审核</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">请核对链上转账金额，输入对应金额以确认通过。</p>
            <div style="margin-bottom:10px;"><label>订单金额：</label><strong id="o-amount-display" style="color:red; font-size: 18px;"></strong></div>
            <div style="margin-bottom:10px;"><label>输入确认金额：</label><input type="number" id="o-amount-input" style="width:100%;" placeholder="请输入订单显示的确切金额"></div>
            <div style="text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('order-modal').style.display='none'">取消</button>
                <button onclick="confirmReview()">确认审核通过</button>
            </div>
        </div>
    </div>

<script>
    const API = 'https://jiaoyouweb.onrender.com';
    const token = 'admin888';
    let editLang = '', bindSiteId = '';
    let genericAction = '', genericId = '';
    let allUsers = [], allOrders = [];
    let currentOrderId = '';

    const allLangs = [
        { code: 'en', name: '🇺🇸 English' }, { code: 'vn', name: '🇻🇳 Tiếng Việt' }, { code: 'es', name: '🇪🇸 Español' },
        { code: 'tr', name: '🇹🇷 Türkçe' }, { code: 'id', name: '🇮🇩 Bahasa Indonesia' }, { code: 'ja', name: '🇯🇵 日本語' },
        { code: 'ko', name: '🇰🇷 한국어' }, { code: 'fr', name: '🇫🇷 Français' }, { code: 'de', name: '🇩🇪 Deutsch' },
        { code: 'ru', name: '🇷🇺 Русский' }, { code: 'pt', name: '🇵🇹 Português' }, { code: 'it', name: '🇮🇹 Italiano' },
        { code: 'ar', name: '🇸🇦 العربية' }, { code: 'th', name: '🇹🇭 ไทย' }
    ];

    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.substring(2);
        if(id === 'tab-collect') loadCollectData();
        if(id === 'tab-category') loadCategories();
        if(id === 'tab-config') loadConfig();
        if(id === 'tab-upload') loadVideoManage();
        if(id === 'tab-user') loadUsers();
        if(id === 'tab-i18n') loadLangs();
        if(id === 'tab-order') loadOrders();
    }

    // ========== 用户管理 (搜索+改密码) ==========
    async function loadUsers() {
        const res = await fetch(`${API}/api/admin/users`, { headers: { 'x-admin-token': token } });
        allUsers = await res.json();
        filterUsers();
    }
    function filterUsers() {
        const kw = document.getElementById('user-search').value.toLowerCase();
        const filtered = allUsers.filter(u => u.email.toLowerCase().includes(kw) || u.name.toLowerCase().includes(kw));
        document.getElementById('user-list').innerHTML = filtered.map(u => `
            <tr>
                <td>${u.id}</td><td>${u.email}</td><td>${u.name}</td><td style="color:green;font-weight:bold;">${u.balance}</td><td>${u.createdAt ? new Date(u.createdAt).toLocaleString() : '-'}</td>
                <td><div class="action-btns"><button class="btn-text" onclick="openEditUser('${u.id}')">编辑</button><button class="btn-danger" onclick="delUser('${u.id}')">删除</button></div></td>
            </tr>
        `).join('');
    }
    function openEditUser(id) {
        const u = allUsers.find(x => x.id === id);
        if(!u) return;
        genericAction = 'user'; genericId = id;
        document.getElementById('gm-title').innerText = '编辑用户';
        document.getElementById('gm-content').innerHTML = `
            <div style="margin-bottom:10px;"><label>昵称：</label><input type="text" id="gm-name" value="${u.name}" style="width:100%;"></div>
            <div style="margin-bottom:10px;"><label>邮箱：</label><input type="text" id="gm-email" value="${u.email}" style="width:100%;"></div>
            <div style="margin-bottom:10px;"><label>余额 (USDT)：</label><input type="number" id="gm-balance" value="${u.balance}" style="width:100%;"></div>
            <div><label>重置密码 (留空不修改)：</label><input type="password" id="gm-password" placeholder="输入新密码" style="width:100%;"></div>
        `;
        document.getElementById('generic-modal').style.display = 'flex';
    }
    async function delUser(id) { if(!confirm('确定删除该用户？')) return; await fetch(`${API}/api/admin/users/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadUsers(); }

    // ========== 订单管理 (展示详情+搜索+审核+验证删除) ==========
    async function loadOrders() {
        const res = await fetch(`${API}/api/admin/orders`, { headers: { 'x-admin-token': token } });
        allOrders = await res.json();
        filterOrders();
    }
    function filterOrders() {
        const kw = document.getElementById('order-search').value.toLowerCase();
        const filtered = allOrders.filter(o => 
            o.id.toLowerCase().includes(kw) || 
            (o.videoName && o.videoName.toLowerCase().includes(kw)) || 
            (o.userEmail && o.userEmail.toLowerCase().includes(kw))
        );
        document.getElementById('order-list').innerHTML = filtered.map(o => `
            <tr>
                <td>
                    <div style="font-weight:bold;">${o.id}</div>
                    <div style="color:#666; font-size:12px;">${o.videoName} (${o.configType})</div>
                </td>
                <td>
                    <div>${o.userName}</div>
                    <div style="color:#666; font-size:12px;">${o.userEmail}</div>
                </td>
                <td style="color:red;font-weight:bold;font-size:15px;">${o.amount.toFixed(2)}</td>
                <td>
                    <div style="color:${o.status === 'pending' ? '#e67e22' : '#27ae60'}; font-weight:bold;">${o.status}</div>
                    <div style="color:#999; font-size:10px; word-break:break-all;">${o.txHash ? 'Hash: '+o.txHash : '-'}</div>
                </td>
                <td>
                    <div style="font-size:12px;">创建: ${new Date(o.createdAt).toLocaleString()}</div>
                    <div style="font-size:12px; color:#666;">确认: ${o.confirmedAt ? new Date(o.confirmedAt).toLocaleString() : '-'}</div>
                </td>
                <td>
                    <div class="action-btns">
                        ${o.status === 'pending' ? `<button class="btn-text" onclick="openReviewOrder('${o.id}')">审核</button>` : ''}
                        <button class="btn-danger" onclick="delOrder('${o.id}')">删除</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }
    function openReviewOrder(id) {
        const o = allOrders.find(x => x.id === id);
        if(!o) return;
        currentOrderId = id;
        document.getElementById('o-amount-display').innerText = o.amount.toFixed(2) + ' USDT';
        document.getElementById('o-amount-input').value = '';
        document.getElementById('order-modal').style.display = 'flex';
    }
    async function confirmReview() {
        const inputVal = parseFloat(document.getElementById('o-amount-input').value);
        const displayVal = parseFloat(document.getElementById('o-amount-display').innerText);
        if (inputVal !== displayVal) {
            return alert('输入的金额与订单金额不一致，请核对链上转账记录！');
        }
        await fetch(`${API}/api/admin/orders/${currentOrderId}/review`, { method: 'POST', headers: { 'x-admin-token': token } });
        alert('审核通过！');
        document.getElementById('order-modal').style.display = 'none';
        loadOrders();
    }
    async function delOrder(id) {
        const inputId = prompt(`请完整输入订单号以确认删除：\n${id}`);
        if (inputId !== id) return alert('订单号输入不正确，取消删除操作。');
        await fetch(`${API}/api/admin/orders/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } });
        loadOrders();
    }

    // 保存通用编辑 (用户/分类)
    async function saveGeneric() {
        if (genericAction === 'cat') {
            await fetch(`${API}/api/admin/categories/edit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ id: genericId, name: document.getElementById('gm-input').value }) });
            loadCategories();
        } else if (genericAction === 'user') {
            const pw = document.getElementById('gm-password').value;
            await fetch(`${API}/api/admin/users/edit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ 
                id: genericId, name: document.getElementById('gm-name').value, email: document.getElementById('gm-email').value, balance: document.getElementById('gm-balance').value, password: pw 
            }) });
            loadUsers();
        }
        document.getElementById('generic-modal').style.display = 'none';
    }

    // ... 你原有保留的其他各种加载、保存、绑定、翻译函数 (直接粘过来) ...
    // 比如 loadCategories(), addCategory(), openEditCat(), delCategory(), loadCollectData(), addSite(), delSite(), openBind(), saveBindings(), startCollect(), loadConfig(), saveSettings(), loadLangs(), toggleLang(), delLang(), editLangData(), saveDict(), saveKey(), translateLang(), translateAll(), openLangModal(), confirmAddLangs(), loadVideoManage(), uploadVideoBatch(), delVideo()

    loadCollectData(); loadUsers();
</script>
</body>
</html>
