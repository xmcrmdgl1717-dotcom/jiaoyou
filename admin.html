<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiya Live 管理后台</title>
    <style>
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --text: #333; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; color: var(--primary); border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 30px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab { display: none; } .tab.active { display: block; }
        .card { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h3 { margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 20px; width: 90%; max-width: 800px; border-radius: 8px; }
        textarea { width: 100%; height: 400px; padding: 10px; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CMS System</div>
        <div class="nav-item active" onclick="switchTab('tab-i18n', this)">🌍 全局语言</div>
        <div class="nav-item" onclick="switchTab('tab-cat', this)">🗂 分类与配置</div>
        <div class="nav-item" onclick="switchTab('tab-upload', this)">📤 视频上传</div>
        <div class="nav-item" onclick="switchTab('tab-order', this)">💳 支付订单</div>
    </div>
    <div class="main">
        <div class="header"><h2 id="page-title">全局语言</h2><button onclick="location.reload()">退出</button></div>
        <div class="content">
            
            <!-- 语言管理 -->
            <div id="tab-i18n" class="tab active">
                <div class="card">
                    <h3>DeepL API Key & 一键翻译</h3>
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <input type="text" id="deepl-key" placeholder="输入 DeepL API Key" style="flex:1;">
                        <button onclick="saveKey()">保存 Key</button>
                        <button onclick="translateAll()" style="background:#1890ff;">🚀 一键翻译所有国家 (补齐缺失)</button>
                    </div>
                    <p id="trans-status" style="color:green; font-size:13px;"></p>
                </div>
                <div class="card">
                    <h3>字典列表</h3>
                    <table>
                        <thead><tr><th>语言代码</th><th>操作</th></tr></thead>
                        <tbody id="lang-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 分类与配置 -->
            <div id="tab-cat" class="tab">
                <div class="card">
                    <h3>系统配置</h3>
                    <div style="display:flex; flex-direction:column; gap:10px; max-width:400px;">
                        <label>TRC20 接收地址：</label>
                        <input type="text" id="set-trc20" placeholder="输入 TRC20 地址">
                        <label>首页【精彩视频】关联分类：</label>
                        <select id="set-hotCat"><option value="all">全部加载</option></select>
                        <label>首页【直播推荐】关联分类：</label>
                        <select id="set-recommendCat"><option value="all">全部加载</option></select>
                        <button onclick="saveSettings()">保存配置</button>
                    </div>
                </div>
                <div class="card">
                    <h3>视频分类管理</h3>
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <input type="text" id="new-cat-name" placeholder="新增分类名称">
                        <button onclick="addCategory()">添加</button>
                    </div>
                    <table>
                        <thead><tr><th>分类 ID</th><th>分类名称</th><th>操作</th></tr></thead>
                        <tbody id="cat-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 视频上传 -->
            <div id="tab-upload" class="tab">
                <div class="card">
                    <h3>上传视频</h3>
                    <div style="display:flex; flex-direction:column; gap:10px; max-width:400px;">
                        <input type="text" id="up-name" placeholder="视频标题">
                        <select id="up-cat"></select>
                        <input type="file" id="up-file" accept="video/*">
                        <button onclick="uploadVideo()">开始上传</button>
                    </div>
                </div>
            </div>

            <!-- 支付订单 -->
            <div id="tab-order" class="tab">
                <div class="card">
                    <h3>订单管理</h3>
                    <table>
                        <thead><tr><th>订单号</th><th>金额 (USDT)</th><th>状态</th><th>过期时间</th><th>操作</th></tr></thead>
                        <tbody id="order-list"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3 id="edit-title">编辑</h3>
            <textarea id="edit-content"></textarea>
            <div style="margin-top:15px; text-align:right;">
                <button onclick="document.getElementById('edit-modal').style.display='none'">取消</button>
                <button onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

<script>
    const API = 'https://jiaoyouweb.onrender.com';
    const token = localStorage.getItem('admin_token') || 'admin888'; // 默认密码
    let currentEditLang = '';

    // 切换Tab
    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.substring(2);
        if(id === 'tab-cat') loadCategoriesAndSettings();
        if(id === 'tab-upload') loadUploadForm();
        if(id === 'tab-order') loadOrders();
    }

    // ========== 多语言 ==========
    function saveKey() {
        localStorage.setItem('deepl_key', document.getElementById('deepl-key').value.trim());
        alert('Key 已保存');
    }
    if(localStorage.getItem('deepl_key')) document.getElementById('deepl-key').value = localStorage.getItem('deepl_key');

    async function translateAll() {
        const key = document.getElementById('deepl-key').value.trim();
        if(!key) return alert('请先输入 Key');
        if(!confirm('确定要一键翻译所有语言吗？这会覆盖原有的其他语言文件。')) return;
        document.getElementById('trans-status').innerText = '正在翻译，请稍候...';
        try {
            const res = await fetch(`${API}/api/admin/translate-all`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify({ apiKey: key })
            });
            const data = await res.json();
            if(data.error) throw new Error(data.error);
            alert(data.message);
            loadLangs();
            document.getElementById('trans-status').innerText = '翻译完成！';
        } catch(e) {
            alert('翻译失败: ' + e.message);
            document.getElementById('trans-status').innerText = '';
        }
    }

    async function loadLangs() {
        const res = await fetch(`${API}/api/admin/i18n-list`, { headers: { 'x-admin-token': token } });
        const langs = await res.json();
        document.getElementById('lang-list').innerHTML = langs.map(l => `
            <tr><td><strong>${l}</strong></td><td><button onclick="editLang('${l}')">编辑字典</button></td></tr>
        `).join('');
    }

    async function editLang(lang) {
        currentEditLang = lang;
        document.getElementById('edit-title').innerText = '编辑 ' + lang;
        document.getElementById('edit-modal').style.display = 'flex';
        document.getElementById('edit-content').value = '加载中...';
        const res = await fetch(`${API}/api/i18n/${lang}`);
        if(res.ok) {
            const data = await res.json();
            document.getElementById('edit-content').value = JSON.stringify(data, null, 2);
        } else {
            document.getElementById('edit-content').value = '{}';
        }
    }

    async function saveEdit() {
        try {
            const data = JSON.parse(document.getElementById('edit-content').value);
            await fetch(`${API}/api/admin/i18n/${currentEditLang}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify(data)
            });
            alert('保存成功');
            document.getElementById('edit-modal').style.display = 'none';
        } catch(e) { alert('JSON 格式错误'); }
    }

    // ========== 分类与设置 ==========
    async function loadCategoriesAndSettings() {
        const resSet = await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } });
        const settings = await resSet.json();
        document.getElementById('set-trc20').value = settings.trc20 || '';
        
        const resCat = await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } });
        const cats = await resCat.json();
        
        let options = '<option value="all">全部加载</option>' + cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        document.getElementById('set-hotCat').innerHTML = options;
        document.getElementById('set-recommendCat').innerHTML = options;
        document.getElementById('set-hotCat').value = settings.hotCat || 'all';
        document.getElementById('set-recommendCat').value = settings.recommendCat || 'all';

        document.getElementById('cat-list').innerHTML = cats.map(c => `
            <tr><td>${c.id}</td><td>${c.name}</td><td><button onclick="delCategory('${c.id}')" style="background:red;">删除</button></td></tr>
        `).join('');
    }

    async function saveSettings() {
        const data = {
            trc20: document.getElementById('set-trc20').value.trim(),
            hotCat: document.getElementById('set-hotCat').value,
            recommendCat: document.getElementById('set-recommendCat').value
        };
        await fetch(`${API}/api/admin/settings`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify(data)
        });
        alert('设置已保存！');
    }

    async function addCategory() {
        const name = document.getElementById('new-cat-name').value.trim();
        if(!name) return;
        await fetch(`${API}/api/admin/categories`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify({ action: 'add', name })
        });
        document.getElementById('new-cat-name').value = '';
        loadCategoriesAndSettings();
    }

    async function delCategory(id) {
        if(!confirm('删除后不会影响已上传视频，仅移除分类本身。')) return;
        await fetch(`${API}/api/admin/categories`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify({ action: 'delete', id })
        });
        loadCategoriesAndSettings();
    }

    // ========== 上传视频 ==========
    async function loadUploadForm() {
        const resCat = await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } });
        const cats = await resCat.json();
        document.getElementById('up-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    async function uploadVideo() {
        const file = document.getElementById('up-file').files[0];
        const name = document.getElementById('up-name').value;
        const cat = document.getElementById('up-cat').value;
        if(!file) return alert('请选择视频');

        const formData = new FormData();
        formData.append('video', file);
        formData.append('name', name);
        formData.append('category', cat);

        try {
            const res = await fetch(`${API}/api/admin/upload-video`, {
                method: 'POST', headers: { 'x-admin-token': token }, body: formData
            });
            const data = await res.json();
            alert(data.message || '上传成功');
            document.getElementById('up-name').value = '';
            document.getElementById('up-file').value = '';
        } catch(e) { alert('上传失败'); }
    }

    // ========== 支付订单 ==========
    async function loadOrders() {
        const res = await fetch(`${API}/api/admin/orders`, { headers: { 'x-admin-token': token } });
        const orders = await res.json();
        document.getElementById('order-list').innerHTML = orders.map(o => `
            <tr>
                <td>${o.id}</td>
                <td style="color:red;font-weight:bold;">${o.amount.toFixed(2)}</td>
                <td>${o.status === 'pending' ? '待支付' : o.status === 'paid' ? '已支付(需上分)' : '已过期'}</td>
                <td>${new Date(o.expireAt).toLocaleString()}</td>
                <td>
                    ${o.status === 'pending' ? `<button onclick="updateOrder('${o.id}', 'paid')" style="background:green;">标记已付</button>` : ''}
                    <button onclick="updateOrder('${o.id}', 'rejected')" style="background:red;">取消</button>
                </td>
            </tr>
        `).join('');
    }

    async function updateOrder(id, status) {
        if(!confirm('确定修改状态？')) return;
        await fetch(`${API}/api/admin/orders/${id}/status`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify({ status })
        });
        loadOrders();
    }

    // 初始化
    loadLangs();
</script>
</body>
</html>
