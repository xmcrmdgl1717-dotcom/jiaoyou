<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS 管理后台</title>
    <style>
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; color: var(--primary); border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 30px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab { display: none; } .tab.active { display: block; }
        .card { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h3 { margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline:none; }
        button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; } .btn-danger { background: #dc3545; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index:999; }
        .modal-box { background: #fff; padding: 20px; width: 90%; max-width: 600px; border-radius: 8px; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 20px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* 上传进度条样式 */
        .progress-bar-container { display: none; width: 100%; height: 12px; background: #eee; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CMS System</div>
        <div class="nav-item active" onclick="switchTab('tab-collect', this)">📥 采集视频</div>
        <div class="nav-item" onclick="switchTab('tab-config', this)">⚙️ 系统配置</div>
        <div class="nav-item" onclick="switchTab('tab-upload', this)">📤 视频上传管理</div>
        <div class="nav-item" onclick="switchTab('tab-i18n', this)">🌍 全局语言</div>
        <div class="nav-item" onclick="switchTab('tab-user', this)">👤 用户管理</div>
        <div class="nav-item" onclick="switchTab('tab-order', this)">💳 支付订单</div>
    </div>
    <div class="main">
        <div class="header"><h2 id="page-title">采集视频</h2><button class="btn-secondary" onclick="location.reload()">退出</button></div>
        <div class="content">
            
            <!-- 采集 -->
            <div id="tab-collect" class="tab active">
                <div class="card">
                    <h3>资源站列表</h3>
                    <div id="site-list"></div>
                    <div class="flex" style="margin-top:15px; background:#fafafa; padding:15px;">
                        <input type="text" id="site-name" placeholder="资源站名称">
                        <input type="text" id="site-url" placeholder="接口地址" style="flex:1;">
                        <select id="site-type"><option value="json">JSON</option><option value="xml">XML</option></select>
                        <button onclick="addSite()">保存</button>
                    </div>
                </div>
                <div class="card">
                    <h3>执行采集</h3>
                    <div class="flex">
                        <select id="collect-site-select" style="width:300px;"></select>
                        <button onclick="startCollect()">一键采集</button>
                        <span id="collect-status" style="color:green;"></span>
                    </div>
                </div>
            </div>

            <!-- 系统配置 -->
            <div id="tab-config" class="tab">
                <div class="card">
                    <h3>系统基础配置</h3>
                    <div style="display:flex; flex-direction:column; gap:15px; max-width:500px;">
                        <div><label>TRC20 接收地址：</label><input type="text" id="set-trc20" style="width:100%;" placeholder="输入 TRC20 地址"></div>
                        <div><label>首页【精彩视频】关联分类：</label><select id="set-hotCat" style="width:100%;"></select></div>
                        <div><label>首页【直播推荐】关联分类：</label><select id="set-recommendCat" style="width:100%;"></select></div>
                        <div><label>未登录试看秒数：</label><input type="number" id="set-preview-limit" style="width:100%;" value="15"></div>
                        <div><label>注册后试看秒数：</label><input type="number" id="set-reg-limit" style="width:100%;" value="120"></div>
                        <div><label>解锁全集金额 (USDT)：</label><input type="number" id="set-price" style="width:100%;" value="9.99"></div>
                        <button onclick="saveSettings()">保存配置</button>
                    </div>
                </div>
                <div class="card">
                    <h3>视频分类管理</h3>
                    <div class="flex" style="margin-bottom:15px;">
                        <input type="text" id="new-cat-name" placeholder="新增分类名称">
                        <button onclick="addCategory()">添加</button>
                    </div>
                    <table><tbody id="cat-list"></tbody></table>
                </div>
            </div>

            <!-- 视频上传 -->
            <div id="tab-upload" class="tab">
                <div class="card">
                    <h3>上传视频 (批量选择最多10个)</h3>
                    <div class="flex">
                        <input type="text" id="up-name" placeholder="视频标题前缀 (可选)">
                        <select id="up-cat"></select>
                        <input type="file" id="up-file" accept="video/*" multiple>
                        <button onclick="uploadVideoBatch()">开始上传</button>
                    </div>
                    <!-- 进度条 UI -->
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="progress-text" id="progress-text" style="display:none;">
                        <span id="progress-status">准备中...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                </div>
                <div class="card">
                    <h3>已上传视频管理</h3>
                    <table><tbody id="video-manage-list"></tbody></table>
                </div>
            </div>

            <!-- 多语言 -->
            <div id="tab-i18n" class="tab">
                <div class="card">
                    <h3>DeepL 翻译设置</h3>
                    <div class="flex">
                        <input type="text" id="deepl-key" placeholder="输入 API Key" style="flex:1;">
                        <button onclick="saveKey()">保存 Key</button>
                        <button class="btn-secondary" onclick="translateMissing()">一键翻译缺失语言</button>
                    </div>
                </div>
                <div class="card">
                    <h3>语言列表 & 快速添加</h3>
                    <div class="flex" style="margin-bottom:15px;">
                        <select id="add-lang-select">
                            <option value="en">🇺🇸 English</option>
                            <option value="vn">🇻🇳 Tiếng Việt</option>
                            <option value="es">🇪🇸 Español</option>
                            <option value="tr">🇹🇷 Türkçe</option>
                            <option value="id">🇮🇩 Bahasa Indonesia</option>
                        </select>
                        <button onclick="addLanguage()">添加国家语言</button>
                    </div>
                    <table><thead><tr><th>语言代码</th><th>启用状态</th><th>操作</th></tr></thead><tbody id="lang-list"></tbody></table>
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="tab-user" class="tab">
                <div class="card">
                    <div class="flex" style="justify-content: space-between; margin-bottom: 15px;">
                        <h3>用户列表</h3>
                        <button class="btn-secondary" onclick="loadUsers()">刷新数据</button>
                    </div>
                    <table>
                        <thead><tr><th>用户 ID</th><th>邮箱</th><th>昵称</th><th>余额 (USDT)</th><th>注册时间</th><th>操作</th></tr></thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 支付订单 -->
            <div id="tab-order" class="tab">
                <div class="card">
                    <h3>订单管理</h3>
                    <table><tbody id="order-list"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3 id="edit-title">编辑</h3>
            <div id="edit-form"></div>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('edit-modal').style.display='none'">取消</button>
                <button onclick="submitEdit()">保存</button>
            </div>
        </div>
    </div>

<script>
    const API = 'https://jiaoyouweb.onrender.com';
    const token = 'admin888';
    let editType = '', editTargetId = '', bindSiteId = '';

    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.substring(2);
        if(id === 'tab-collect') loadCollectData();
        if(id === 'tab-config') loadConfig();
        if(id === 'tab-upload') loadVideoManage();
        if(id === 'tab-user') loadUsers();
        if(id === 'tab-i18n') loadLangs();
        if(id === 'tab-order') loadOrders();
    }

    // ========== 用户管理 ==========
    async function loadUsers() {
        const tbody = document.getElementById('user-list');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">加载中...</td></tr>';
        try {
            const res = await fetch(`${API}/api/admin/users`, { headers: { 'x-admin-token': token } });
            const users = await res.json();
            if(!Array.isArray(users) || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#999;">暂无用户注册数据</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id || '-'}</td>
                    <td>${u.email}</td>
                    <td>${u.name}</td>
                    <td style="color:green;font-weight:bold;">${u.balance || 0}</td>
                    <td>${u.createdAt ? new Date(u.createdAt).toLocaleString() : '-'}</td>
                    <td><button class="btn-secondary" onclick="editUser('${u.email}', ${u.balance || 0})">修改余额</button></td>
                </tr>
            `).join('');
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">数据加载失败，请检查网络</td></tr>';
        }
    }
    function editUser(email, balance) {
        editType = 'user'; editTargetId = email;
        document.getElementById('edit-title').innerText = '修改用户余额';
        document.getElementById('edit-form').innerHTML = `<label>余额 (USDT)：</label><input type="number" id="eu-bal" value="${balance}" style="width:100%;">`;
        document.getElementById('edit-modal').style.display = 'flex';
    }

    // ========== 视频管理 & 批量上传 ==========
    async function loadVideoManage() {
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('up-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        const vids = await (await fetch(`${API}/api/admin/videos`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('video-manage-list').innerHTML = vids.map(v => `
            <tr><td>${v.name}</td><td>${v.category}</td>
            <td><button class="btn-secondary" onclick="editVideo('${v.id}', '${v.name}', '${v.category}')">编辑</button>
            <button class="btn-danger" onclick="delVideo('${v.id}')">删除</button></td></tr>
        `).join('');
    }
    
    async function uploadVideoBatch() {
        const files = document.getElementById('up-file').files;
        if(files.length === 0) return alert('请选择视频文件');
        if(files.length > 10) return alert('单次最多只能上传 10 个视频！');
        
        const baseName = document.getElementById('up-name').value.trim();
        const category = document.getElementById('up-cat').value;
        
        const container = document.getElementById('progress-container');
        const bar = document.getElementById('progress-bar');
        const textContainer = document.getElementById('progress-text');
        const statusText = document.getElementById('progress-status');
        const percentText = document.getElementById('progress-percent');
        
        container.style.display = 'block';
        textContainer.style.display = 'flex';
        
        let successCount = 0;
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const title = baseName ? `${baseName}_${i+1}` : file.name;
            statusText.innerText = `正在上传 (${i+1}/${files.length}): ${title}`;
            
            try {
                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    const fd = new FormData();
                    fd.append('video', file);
                    fd.append('name', title);
                    fd.append('category', category);
                    
                    xhr.open('POST', `${API}/api/admin/upload-video`, true);
                    xhr.setRequestHeader('x-admin-token', token);
                    
                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            // 计算总进度 = 已完成文件的比例 + 当前文件的进度
                            const percent = Math.round(((i / files.length) * 100) + ((e.loaded / e.total) * (100 / files.length)));
                            bar.style.width = percent + '%';
                            percentText.innerText = percent + '%';
                        }
                    };
                    
                    xhr.onload = () => {
                        if (xhr.status === 200) resolve();
                        else reject(new Error('上传失败'));
                    };
                    xhr.onerror = () => reject(new Error('网络错误'));
                    xhr.send(fd);
                });
                successCount++;
            } catch(e) {
                console.error(e);
            }
        }
        
        statusText.innerText = `上传结束！成功: ${successCount} / ${files.length}`;
        bar.style.width = '100%'; percentText.innerText = '100%';
        document.getElementById('up-file').value = '';
        setTimeout(() => { container.style.display = 'none'; textContainer.style.display = 'none'; bar.style.width = '0%'; }, 3000);
        loadVideoManage();
    }

    function editVideo(id, name, cat) {
        editType = 'video'; editTargetId = id;
        document.getElementById('edit-title').innerText = '编辑视频';
        document.getElementById('edit-form').innerHTML = `
            <label>标题：</label><input type="text" id="ev-name" value="${name}" style="width:100%;margin-bottom:10px;">
            <label>分类：</label><input type="text" id="ev-cat" value="${cat}" style="width:100%;">
        `;
        document.getElementById('edit-modal').style.display = 'flex';
    }
    async function delVideo(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/videos/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadVideoManage(); }

    async function submitEdit() {
        if (editType === 'video') {
            await fetch(`${API}/api/admin/videos/edit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ id: editTargetId, name: document.getElementById('ev-name').value, category: document.getElementById('ev-cat').value }) });
            loadVideoManage();
        } else if (editType === 'user') {
            await fetch(`${API}/api/admin/users/balance`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ email: editTargetId, balance: document.getElementById('eu-bal').value }) });
            loadUsers();
        }
        document.getElementById('edit-modal').style.display = 'none';
    }

    // ========== 配置与采集等其他 ==========
    async function loadConfig() {
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('set-trc20').value = s.trc20 || '';
        document.getElementById('set-preview-limit').value = s.videoPreviewLimit || 15;
        document.getElementById('set-reg-limit').value = s.registeredPreviewLimit || 120;
        document.getElementById('set-price').value = s.unlockPrice || 9.99;
        let opts = '<option value="all">全部加载</option>' + cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        document.getElementById('set-hotCat').innerHTML = opts; document.getElementById('set-hotCat').value = s.hotCat || 'all';
        document.getElementById('set-recommendCat').innerHTML = opts; document.getElementById('set-recommendCat').value = s.recommendCat || 'all';
        document.getElementById('cat-list').innerHTML = cats.map(c => `<tr><td>${c.name}</td><td><button class="btn-danger" onclick="delCat('${c.id}')">删除</button></td></tr>`).join('');
    }
    async function saveSettings() {
        await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({
            trc20: document.getElementById('set-trc20').value,
            hotCat: document.getElementById('set-hotCat').value,
            recommendCat: document.getElementById('set-recommendCat').value,
            videoPreviewLimit: Number(document.getElementById('set-preview-limit').value),
            registeredPreviewLimit: Number(document.getElementById('set-reg-limit').value),
            unlockPrice: Number(document.getElementById('set-price').value)
        })});
        alert('保存成功');
    }
    async function addCategory() { await fetch(`${API}/api/admin/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ action: 'add', name: document.getElementById('new-cat-name').value }) }); loadConfig(); }
    async function delCat(id) { if(!confirm('确定?'))return; await fetch(`${API}/api/admin/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ action: 'delete', id }) }); loadConfig(); }
    
    async function loadLangs() {
        const list = await (await fetch(`${API}/api/admin/i18n-list`, { headers: { 'x-admin-token': token } })).json();
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        const enabled = s.enabledLangs || ['zh'];
        document.getElementById('lang-list').innerHTML = list.map(lang => `
            <tr>
                <td>${lang}</td>
                <td><label class="switch"><input type="checkbox" ${enabled.includes(lang) ? 'checked' : ''} onchange="toggleLang('${lang}', this.checked)"><span class="slider"></span></label></td>
                <td><button class="btn-text" onclick="editLangData('${lang}')">编辑字典</button> <button class="btn-danger" onclick="delLang('${lang}')">删除</button></td>
            </tr>
        `).join('');
    }
    async function toggleLang(lang, isEnabled) {
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        let en = s.enabledLangs || ['zh'];
        if (isEnabled) { if(!en.includes(lang)) en.push(lang); }
        else { en = en.filter(x => x !== lang); }
        await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ enabledLangs: en }) });
    }
    async function addLanguage() {
        const lang = document.getElementById('add-lang-select').value;
        await fetch(`${API}/api/admin/i18n/${lang}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({}) });
        alert('添加成功'); loadLangs();
    }
    async function delLang(lang) {
        if(!confirm('确定删除该语言？')) return;
        await fetch(`${API}/api/admin/i18n/${lang}`, { method: 'DELETE', headers: { 'x-admin-token': token } });
        loadLangs();
    }
    async function editLangData(lang) {
        editLang = lang; document.getElementById('edit-title').innerText = '编辑 ' + lang;
        document.getElementById('edit-content').value = '加载中...';
        document.getElementById('edit-modal').style.display = 'flex';
        const res = await fetch(`${API}/api/admin/i18n-content/${lang}`, { headers: { 'x-admin-token': token } });
        const data = await res.json();
        document.getElementById('edit-content').value = JSON.stringify(data, null, 2);
    }
    async function saveDict() {
        try {
            const data = JSON.parse(document.getElementById('edit-content').value);
            await fetch(`${API}/api/admin/i18n/${editLang}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify(data) });
            alert('保存成功'); document.getElementById('edit-modal').style.display = 'none';
        } catch (e) { alert('JSON 格式错误'); }
    }
    function saveKey() { localStorage.setItem('deepl_key', document.getElementById('deepl-key').value); alert('已保存'); }
    if(localStorage.getItem('deepl_key')) document.getElementById('deepl-key').value = localStorage.getItem('deepl_key');
    async function translateMissing() {
        const key = localStorage.getItem('deepl_key');
        if(!key) return alert('请先输入并保存 Key');
        if(!confirm('确定一键翻译缺失语言吗？')) return;
        const res = await fetch(`${API}/api/admin/translate-missing`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ apiKey: key }) });
        const d = await res.json();
        alert(d.message); loadLangs();
    }

    async function loadCollectData() {
        const sites = await (await fetch(`${API}/api/admin/sites`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('site-list').innerHTML = sites.map(s => `
            <div style="border:1px solid #eee; padding:10px; margin-bottom:10px; display:flex; justify-content:space-between;">
                <span>${s.name} (${s.url})</span>
                <div><button class="btn-danger" onclick="delSite('${s.id}')">删除</button></div>
            </div>
        `).join('');
        document.getElementById('collect-site-select').innerHTML = sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    async function addSite() {
        const name = document.getElementById('site-name').value;
        const url = document.getElementById('site-url').value;
        const type = document.getElementById('site-type').value;
        await fetch(`${API}/api/admin/sites`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ name, url, type }) });
        loadCollectData();
    }
    async function startCollect() {
        const id = document.getElementById('collect-site-select').value;
        document.getElementById('collect-status').innerText = '采集中...';
        const res = await fetch(`${API}/api/admin/collect/${id}`, { method: 'POST', headers: { 'x-admin-token': token } });
        const data = await res.json();
        alert(data.message || data.error);
        document.getElementById('collect-status').innerText = '';
    }
    async function delSite(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/sites/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadCollectData(); }

    async function loadOrders() {
        const o = await (await fetch(`${API}/api/admin/orders`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('order-list').innerHTML = o.map(x => `<tr><td>${x.id}</td><td>${x.amount}</td><td>${x.status}</td></tr>`).join('');
    }

    loadCollectData();
    loadUsers();
</script>
</body>
</html>
