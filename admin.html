<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS 管理后台</title>
    <style>
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --text: #333; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; color: var(--primary); border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 30px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab { display: none; } .tab.active { display: block; }
        .card { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h3 { margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline:none; }
        button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; } .btn-danger { background: #dc3545; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index:999; }
        .modal-box { background: #fff; padding: 20px; width: 500px; border-radius: 8px; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CMS System</div>
        <div class="nav-item active" onclick="switchTab('tab-collect', this)">📥 采集视频</div>
        <div class="nav-item" onclick="switchTab('tab-cat', this)">🗂 分类与配置</div>
        <div class="nav-item" onclick="switchTab('tab-upload', this)">📤 视频上传管理</div>
        <div class="nav-item" onclick="switchTab('tab-i18n', this)">🌍 全局语言</div>
        <div class="nav-item" onclick="switchTab('tab-user', this)">👤 用户管理</div>
        <div class="nav-item" onclick="switchTab('tab-order', this)">💳 支付订单</div>
    </div>
    <div class="main">
        <div class="header"><h2 id="page-title">采集视频</h2><button class="btn-secondary" onclick="location.reload()">退出</button></div>
        <div class="content">
            
            <!-- 采集视频 -->
            <div id="tab-collect" class="tab active">
                <div class="card">
                    <h3>资源站列表</h3>
                    <div id="site-list"></div>
                    <div class="flex" style="margin-top:15px; background:#fafafa; padding:15px;">
                        <input type="text" id="site-name" placeholder="资源站名称">
                        <input type="text" id="site-url" placeholder="接口地址 (XML/JSON)" style="flex:1;">
                        <select id="site-type"><option value="xml">XML</option><option value="json">JSON</option></select>
                        <button onclick="addSite()">保存</button>
                    </div>
                </div>
                <div id="bind-panel" class="card" style="display:none;">
                    <h3>分类绑定 <button class="btn-secondary" style="float:right; padding:4px 10px;" onclick="document.getElementById('bind-panel').style.display='none'">关闭</button></h3>
                    <table>
                        <thead><tr><th>源站分类</th><th>本地分类</th></tr></thead>
                        <tbody id="bind-tbody"></tbody>
                    </table>
                    <button style="margin-top:10px;" onclick="saveBindings()">保存绑定</button>
                </div>
                <div class="card">
                    <h3>执行采集</h3>
                    <div class="flex">
                        <select id="collect-site-select" style="width:300px;"></select>
                        <button onclick="startCollect()">一键采集</button>
                        <span id="collect-status" style="color:green;"></span>
                    </div>
                </div>
            </div>

            <!-- 分类与配置 -->
            <div id="tab-cat" class="tab">
                <div class="card">
                    <h3>系统配置</h3>
                    <div style="display:flex; flex-direction:column; gap:10px; max-width:400px;">
                        <input type="text" id="set-trc20" placeholder="TRC20 接收地址">
                        <select id="set-hotCat"></select>
                        <select id="set-recommendCat"></select>
                        <button onclick="saveSettings()">保存配置</button>
                    </div>
                </div>
                <div class="card">
                    <h3>视频分类管理</h3>
                    <div class="flex" style="margin-bottom:15px;">
                        <input type="text" id="new-cat-name" placeholder="新增分类名称">
                        <button onclick="addCategory()">添加</button>
                    </div>
                    <table>
                        <thead><tr><th>分类 ID</th><th>分类名称</th><th>操作</th></tr></thead>
                        <tbody id="cat-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 视频上传管理 -->
            <div id="tab-upload" class="tab">
                <div class="card">
                    <h3>上传视频</h3>
                    <div class="flex">
                        <input type="text" id="up-name" placeholder="视频标题">
                        <select id="up-cat"></select>
                        <input type="file" id="up-file" accept="video/*">
                        <button onclick="uploadVideo()">上传</button>
                    </div>
                </div>
                <div class="card">
                    <h3>已上传视频管理</h3>
                    <table>
                        <thead><tr><th>标题</th><th>分类</th><th>操作</th></tr></thead>
                        <tbody id="video-manage-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="tab-user" class="tab">
                <div class="card">
                    <h3>用户列表</h3>
                    <table>
                        <thead><tr><th>邮箱</th><th>昵称</th><th>余额 (USDT)</th><th>操作</th></tr></thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 语言 -->
            <div id="tab-i18n" class="tab">
                <div class="card">
                    <h3>DeepL API Key</h3>
                    <div class="flex">
                        <input type="text" id="deepl-key" placeholder="输入 API Key" style="flex:1;">
                        <button onclick="saveKey()">保存 Key</button>
                    </div>
                </div>
                <div class="card">
                    <h3>字典列表</h3>
                    <table><tbody id="lang-list"></tbody></table>
                </div>
            </div>

            <!-- 支付 -->
            <div id="tab-order" class="tab">
                <div class="card">
                    <h3>订单列表</h3>
                    <table><tbody id="order-list"></tbody></table>
                </div>
            </div>

        </div>
    </div>

    <!-- 弹窗 -->
    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3 id="edit-title">编辑</h3>
            <div id="edit-form"></div>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('edit-modal').style.display='none'">取消</button>
                <button onclick="submitEdit()">保存</button>
            </div>
        </div>
    </div>

<script>
    const API = 'https://jiaoyouweb.onrender.com';
    const token = 'admin888';
    let editType = '', editTargetId = '', bindSiteId = '';

    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.substring(2);
        if(id === 'tab-collect') loadCollectData();
        if(id === 'tab-cat') loadCatSettings();
        if(id === 'tab-upload') loadVideoManage();
        if(id === 'tab-user') loadUsers();
        if(id === 'tab-i18n') loadLangs();
        if(id === 'tab-order') loadOrders();
    }

    // ========== 采集 ==========
    async function loadCollectData() {
        const res = await fetch(`${API}/api/admin/sites`, { headers: { 'x-admin-token': token } });
        const sites = await res.json();
        document.getElementById('site-list').innerHTML = sites.map(s => `
            <div style="border:1px solid #eee; padding:10px; margin-bottom:10px; display:flex; justify-content:space-between;">
                <span>${s.name} (${s.url})</span>
                <div>
                    <button class="btn-secondary" onclick="openBind('${s.id}')">绑定分类</button>
                    <button class="btn-danger" onclick="delSite('${s.id}')">删除</button>
                </div>
            </div>
        `).join('');
        document.getElementById('collect-site-select').innerHTML = sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    async function addSite() {
        const name = document.getElementById('site-name').value;
        const url = document.getElementById('site-url').value;
        const type = document.getElementById('site-type').value;
        await fetch(`${API}/api/admin/sites`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ name, url, type }) });
        loadCollectData();
    }
    async function delSite(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/sites/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadCollectData(); }
    
    async function openBind(id) {
        bindSiteId = id; document.getElementById('bind-panel').style.display = 'block';
        const res = await fetch(`${API}/api/admin/sites/${id}/categories`, { headers: { 'x-admin-token': token } });
        const cats = await res.json();
        const localCats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('bind-tbody').innerHTML = cats.map(c => `
            <tr>
                <td>${c.name} (${c.id})</td>
                <td>
                    <input type="hidden" class="bind-sid" value="${c.id}" data-name="${c.name}">
                    <select class="bind-local">${localCats.map(lc => `<option value="${lc.name}">${lc.name}</option>`).join('')}</select>
                </td>
            </tr>
        `).join('');
    }
    async function saveBindings() {
        const inputs = document.querySelectorAll('#bind-tbody tr');
        let mappings = [];
        inputs.forEach(tr => {
            mappings.push({ sourceId: tr.querySelector('.bind-sid').value, sourceName: tr.querySelector('.bind-sid').dataset.name, localCategory: tr.querySelector('.bind-local').value });
        });
        await fetch(`${API}/api/admin/sites/${bindSiteId}/bind`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ mappings }) });
        alert('绑定成功'); document.getElementById('bind-panel').style.display = 'none';
    }

    async function startCollect() {
        const id = document.getElementById('collect-site-select').value;
        document.getElementById('collect-status').innerText = '采集中...';
        const res = await fetch(`${API}/api/admin/collect/${id}`, { method: 'POST', headers: { 'x-admin-token': token } });
        const data = await res.json();
        alert(data.message || data.error);
        document.getElementById('collect-status').innerText = '';
    }

    // ========== 分类与设置 ==========
    async function loadCatSettings() {
        const set = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('set-trc20').value = set.trc20 || '';
        let opts = '<option value="all">全部加载</option>' + cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        document.getElementById('set-hotCat').innerHTML = opts; document.getElementById('set-hotCat').value = set.hotCat || 'all';
        document.getElementById('set-recommendCat').innerHTML = opts; document.getElementById('set-recommendCat').value = set.recommendCat || 'all';
        
        document.getElementById('cat-list').innerHTML = cats.map(c => `<tr><td>${c.id}</td><td>${c.name}</td><td><button class="btn-danger" onclick="delCat('${c.id}')">删除</button></td></tr>`).join('');
    }
    async function saveSettings() {
        await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ trc20: document.getElementById('set-trc20').value, hotCat: document.getElementById('set-hotCat').value, recommendCat: document.getElementById('set-recommendCat').value }) });
        alert('保存成功');
    }
    async function addCategory() { await fetch(`${API}/api/admin/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ action: 'add', name: document.getElementById('new-cat-name').value }) }); loadCatSettings(); }
    async function delCat(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ action: 'delete', id }) }); loadCatSettings(); }

    // ========== 视频上传管理 ==========
    async function loadVideoManage() {
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('up-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        
        const vids = await (await fetch(`${API}/api/admin/videos`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('video-manage-list').innerHTML = vids.map(v => `
            <tr>
                <td>${v.name}</td><td>${v.category}</td>
                <td>
                    <button class="btn-secondary" onclick="editVideo('${v.id}', '${v.name}', '${v.category}')">编辑</button>
                    <button class="btn-danger" onclick="delVideo('${v.id}')">删除</button>
                </td>
            </tr>
        `).join('');
    }
    async function uploadVideo() {
        const file = document.getElementById('up-file').files[0];
        if(!file) return alert('选文件');
        const fd = new FormData();
        fd.append('video', file); fd.append('name', document.getElementById('up-name').value); fd.append('category', document.getElementById('up-cat').value);
        const res = await fetch(`${API}/api/admin/upload-video`, { method: 'POST', headers: { 'x-admin-token': token }, body: fd });
        alert((await res.json()).message); loadVideoManage();
    }
    async function delVideo(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/videos/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadVideoManage(); }

    // 通用弹窗编辑 (视频/用户)
    function editVideo(id, name, cat) {
        editType = 'video'; editTargetId = id;
        document.getElementById('edit-title').innerText = '编辑视频';
        document.getElementById('edit-form').innerHTML = `
            <label>标题：</label><input type="text" id="ev-name" value="${name}" style="width:100%;margin-bottom:10px;">
            <label>分类：</label><input type="text" id="ev-cat" value="${cat}" style="width:100%;">
        `;
        document.getElementById('edit-modal').style.display = 'flex';
    }
    
    // ========== 用户管理 ==========
    async function loadUsers() {
        const users = await (await fetch(`${API}/api/admin/users`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('user-list').innerHTML = users.map(u => `
            <tr>
                <td>${u.email}</td><td>${u.name}</td><td style="color:green;font-weight:bold;">${u.balance || 0}</td>
                <td><button class="btn-secondary" onclick="editUser('${u.email}', ${u.balance || 0})">修改余额</button></td>
            </tr>
        `).join('');
    }
    function editUser(email, balance) {
        editType = 'user'; editTargetId = email;
        document.getElementById('edit-title').innerText = '修改用户余额';
        document.getElementById('edit-form').innerHTML = `<label>余额 (USDT)：</label><input type="number" id="eu-bal" value="${balance}" style="width:100%;">`;
        document.getElementById('edit-modal').style.display = 'flex';
    }

    async function submitEdit() {
        if (editType === 'video') {
            await fetch(`${API}/api/admin/videos/edit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ id: editTargetId, name: document.getElementById('ev-name').value, category: document.getElementById('ev-cat').value }) });
            loadVideoManage();
        } else if (editType === 'user') {
            await fetch(`${API}/api/admin/users/balance`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ email: editTargetId, balance: document.getElementById('eu-bal').value }) });
            loadUsers();
        }
        document.getElementById('edit-modal').style.display = 'none';
    }

    // ========== 语言与订单基础 ==========
    async function loadLangs() { const l = await (await fetch(`${API}/api/admin/i18n-list`, { headers: { 'x-admin-token': token } })).json(); document.getElementById('lang-list').innerHTML = l.map(x => `<tr><td>${x}</td></tr>`).join(''); }
    async function loadOrders() { const o = await (await fetch(`${API}/api/admin/orders`, { headers: { 'x-admin-token': token } })).json(); document.getElementById('order-list').innerHTML = o.map(x => `<tr><td>${x.id}</td><td>${x.amount}</td></tr>`).join(''); }
    function saveKey() { localStorage.setItem('deepl_key', document.getElementById('deepl-key').value); alert('已保存'); }
    if(localStorage.getItem('deepl_key')) document.getElementById('deepl-key').value = localStorage.getItem('deepl_key');

    loadCollectData();
</script>
</body>
</html>
