<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiya Live 管理后台</title>
    <style>
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --text-main: #333; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 240px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-logo { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; color: var(--primary); text-align: center; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; font-weight: 600; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #fff; padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 30px; }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 24px; }
        h3 { font-size: 16px; margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: monospace; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-secondary { background: #6c757d; } .btn-danger { background: #dc3545; } .btn-text { background: none; color: #1890ff; padding: 0; font-size: 13px; }
        .btn-text:hover { text-decoration: underline; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e6f7e6; color: #38a169; border: 1px solid #c6f6d5; }
        .hidden { display: none !important; }

        /* 弹窗 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #fff; width: 90%; max-width: 800px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-box textarea { flex: 1; min-height: 400px; resize: vertical; padding: 15px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-logo">Hiya Live CMS</div>
    <div class="nav-item active" onclick="switchTab('tab-collect', this)">📥 采集管理</div>
    <div class="nav-item" onclick="switchTab('tab-i18n', this)">🌍 多语言管理</div>
</div>

<!-- 主内容 -->
<div class="main-content">
    <div class="header">
        <h2 id="page-title">采集管理</h2>
        <button class="btn-secondary" onclick="logout()">退出</button>
    </div>
    
    <div class="content-scroll">
        <!-- ================= 采集管理 (保持原样，无需文件上传) ================= -->
        <div id="tab-collect" class="tab-pane active">
            <div class="card">
                <h3>📡 资源站管理</h3>
                <div id="site-list"></div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 15px;">
                    <input type="text" id="site-name" placeholder="资源站名称" style="margin-bottom:10px;">
                    <input type="text" id="site-url" placeholder="接口地址" style="margin-bottom:10px;">
                    <select id="site-type" style="margin-bottom:10px;"><option value="xml">XML</option><option value="json">JSON</option></select>
                    <button onclick="addSite()">保存资源站</button>
                </div>
            </div>
            <!-- 此处省略控制台，保持你原来的即可 -->
        </div>

        <!-- ================= 多语言管理 ================= -->
        <div id="tab-i18n" class="tab-pane">
            <div class="card">
                <h3>🌐 语言列表</h3>
                <p style="font-size:13px; color:#888; margin-bottom:15px;">提示：所有修改会自动保存到后端，全球用户实时生效，无需下载上传。</p>
                <table>
                    <thead>
                        <tr><th>代码</th><th>名称</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="lang-list">
                        <!-- JS 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 🔴 编辑字典弹窗 -->
<div id="edit-modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="edit-title" style="margin-bottom:15px;">编辑字典</h3>
        <textarea id="dict-content" spellcheck="false"></textarea>
        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn-secondary" onclick="closeEditModal()">取消</button>
            <button onclick="saveDict()">保存到服务器</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://jiaoyouweb.onrender.com';
    let token = localStorage.getItem('admin_token') || '';
    let currentLangForEdit = '';
    let currentLangList = [];

    // ================= 登录与基础逻辑 =================
    // 假设你已经有了登录逻辑，这里省略，只写关键业务
    if (!token) {
        const pwd = prompt("请输入管理员密码 (默认 admin888)");
        if (pwd) {
            localStorage.setItem('admin_token', pwd);
            location.reload();
        }
    }

    function logout() { localStorage.removeItem('admin_token'); location.reload(); }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
        document.getElementById('page-title').textContent = el.innerText.substring(2).trim();
        
        if (tabId === 'tab-i18n') {
            loadLangList();
        }
    }

    // ================= 多语言 API 逻辑 =================
    async function loadLangList() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/i18n-list`, { headers: { 'x-admin-token': token } });
            const data = await res.json();
            
            // 默认如果后端没数据，先展示静态列表
            if (!Array.isArray(data) || data.length === 0) {
                currentLangList = ['zh', 'en', 'vn', 'es', 'tr', 'id'];
            } else {
                currentLangList = data;
            }

            const tbody = document.getElementById('lang-list');
            const langNames = { 'zh': 'CN 简体中文', 'en': 'US English', 'vn': 'VN Tiếng Việt', 'es': 'ES Español', 'tr': 'TR Türkçe', 'id': 'ID Bahasa Indonesia' };

            tbody.innerHTML = currentLangList.map(lang => `
                <tr>
                    <td><strong>${lang}</strong></td>
                    <td>${langNames[lang] || lang}</td>
                    <td><span class="tag">已启用</span></td>
                    <td>
                        ${lang !== 'zh' ? `<button class="btn-text" onclick="translateLang('${lang}')">一键翻译</button> | ` : ''}
                        <button class="btn-text" onclick="openEditModal('${lang}')">编辑字典</button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            alert('获取语言列表失败，请检查后端');
        }
    }

    // 打开字典编辑弹窗
    async function openEditModal(lang) {
        currentLangForEdit = lang;
        document.getElementById('edit-title').textContent = `编辑字典 - ${lang.toUpperCase()}`;
        document.getElementById('dict-content').value = '正在拉取数据...';
        document.getElementById('edit-modal').classList.remove('hidden');

        try {
            const res = await fetch(`${API_BASE}/api/i18n/${lang}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('dict-content').value = JSON.stringify(data, null, 2);
            } else {
                // 如果是新语言没有数据，给一个空 JSON 模板
                document.getElementById('dict-content').value = "{}";
            }
        } catch (e) {
            document.getElementById('dict-content').value = "拉取失败，请确认网络";
        }
    }

    function closeEditModal() {
        document.getElementById('edit-modal').classList.add('hidden');
    }

    // 保存字典
    async function saveDict() {
        const rawJson = document.getElementById('dict-content').value;
        let parsedData;
        try {
            parsedData = JSON.parse(rawJson);
        } catch (e) {
            return alert('JSON 格式错误，请检查括号或逗号！');
        }

        const btn = event.target;
        btn.disabled = true;
        btn.textContent = '保存中...';

        try {
            const res = await fetch(`${API_BASE}/api/admin/i18n/${currentLangForEdit}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify(parsedData)
            });
            if (res.ok) {
                alert('保存成功！全球用户刷新页面即刻生效。');
                closeEditModal();
            } else {
                alert('保存失败');
            }
        } catch (e) { alert('网络错误'); }
        finally { btn.disabled = false; btn.textContent = '保存到服务器'; }
    }

    // 一键翻译
    async function translateLang(targetLang) {
        if (targetLang === 'zh') return alert('中文是基准语言');
        
        const apiKey = prompt("请输入 DeepL API Key:");
        if (!apiKey) return;

        // 这里为了方便，弹窗确认
        if (!confirm(`确定要基于后端的中文包翻译成 ${targetLang.toUpperCase()} 吗？这可能需要几秒钟。`)) return;

        try {
            // 通过提示框告知正在翻译
            const originalText = document.getElementById('page-title').textContent;
            document.getElementById('page-title').textContent = '⚡ 正在翻译，请稍候...';

            const res = await fetch(`${API_BASE}/api/admin/translate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify({ apiKey, targetLang })
            });
            
            const result = await res.json();
            if (result.error) throw new Error(result.error);
            
            alert(result.message || '翻译成功！');
            loadLangList(); // 刷新表格
            document.getElementById('page-title').textContent = originalText;
        } catch (error) {
            alert('翻译失败: ' + error.message);
            document.getElementById('page-title').textContent = '多语言管理';
        }
    }

    // 初始化加载列表
    if (token) loadLangList();
</script>
</body>
</html>
