<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶香香资源采集后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        h1, h2 { color: #1a1a1a; margin-bottom: 20px; }
        h2 { border-left: 4px solid #ff6b9d; padding-left: 10px; font-size: 18px; margin-top: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background: #ff6b9d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #e55a8a; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .site-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .site-card .site-info { flex: 1; }
        .site-card .site-info strong { display: block; font-size: 16px; margin-bottom: 4px; }
        .site-card .site-info small { color: #888; word-break: break-all; }
        .site-actions { display: flex; gap: 10px; }
        .bind-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .bind-table th, .bind-table td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        .bind-table th { background: #f8f9fa; }
        .bind-table input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
        .hidden { display: none; }
        .flex { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- 登录面板 -->
    <div id="login-panel">
        <h1>🔐 后台登录</h1>
        <div class="form-group">
            <label>管理密码</label>
            <input type="password" id="admin-password" placeholder="请输入密码 (默认: admin888)">
        </div>
        <button onclick="login()">登录</button>
        <p id="login-error" style="color: #dc3545; margin-top: 10px; font-size: 13px;"></p>
    </div>

    <!-- 管理面板 -->
    <div id="admin-panel" class="hidden">
        <div class="flex" style="justify-content: space-between; margin-bottom: 20px;">
            <h1 style="margin: 0;">⚙️ 资源采集管理</h1>
            <button class="btn-secondary" onclick="logout()">退出登录</button>
        </div>

        <!-- 资源站列表 -->
        <h2>📡 资源站管理</h2>
        <div id="site-list"></div>

        <!-- 添加资源站 -->
        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px;">
            <h3 style="margin-bottom: 15px;">➕ 添加资源站</h3>
            <div class="form-group">
                <label>资源站名称</label>
                <input type="text" id="site-name" placeholder="例如: 奶香香资源站">
            </div>
            <div class="form-group">
                <label>接口地址</label>
                <input type="text" id="site-url" placeholder="https://naixxzy.com/api.php/provide/vod/at/xml/">
            </div>
            <div class="form-group">
                <label>接口类型</label>
                <select id="site-type">
                    <option value="xml">XML</option>
                    <option value="json">JSON</option>
                </select>
            </div>
            <button onclick="addSite()">保存资源站</button>
        </div>

        <!-- 分类绑定面板 (动态显示) -->
        <div id="bind-panel" class="hidden">
            <h2>🔗 分类绑定</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">请将资源站分类映射到你的本地分类（如：电影、电视剧、动漫）</p>
            <table class="bind-table">
                <thead>
                    <tr>
                        <th>资源站分类 ID</th>
                        <th>资源站分类名称</th>
                        <th>绑定到本地分类</th>
                    </tr>
                </thead>
                <tbody id="bind-tbody"></tbody>
            </table>
            <button style="margin-top: 15px;" onclick="saveBindings()">保存绑定关系</button>
            <button class="btn-secondary" style="margin-top: 15px; margin-left: 10px;" onclick="closeBindPanel()">取消</button>
        </div>

        <!-- 采集控制台 -->
        <h2>🚀 采集控制台</h2>
        <div class="form-group">
            <label>选择要采集的资源站</label>
            <select id="collect-site-select"></select>
        </div>
        <div class="flex">
            <button onclick="startCollect()" id="collect-btn">开始采集</button>
            <span id="collect-status" style="font-size: 14px; color: #666;"></span>
        </div>
        <div class="result-box" id="collect-result">
            等待采集...
        </div>

        <!-- 已采集视频预览 -->
        <h2>🎬 已采集视频</h2>
        <div id="video-list" style="max-height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px;">
            <p style="color: #888;">加载中...</p>
        </div>
    </div>
</div>

<script>
    // 🔴 核心修改：这里填入你的后端 API 地址
    const API_BASE = 'https://jiaoyouweb.onrender.com';
    
    let token = localStorage.getItem('admin_token') || '';
    let currentBindSiteId = null;

    // ================= 登录/登出 =================
    function login() {
        const pwd = document.getElementById('admin-password').value;
        fetch(`${API_BASE}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                token = data.token;
                localStorage.setItem('admin_token', token);
                showAdminPanel();
            } else {
                document.getElementById('login-error').textContent = data.error;
            }
        })
        .catch(() => alert('登录请求失败，请检查后端服务是否已启动（冷启动可能需50秒）'));
    }

    function logout() {
        localStorage.removeItem('admin_token');
        location.reload();
    }

    function showAdminPanel() {
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadSites();
        loadVideos();
    }

    // 页面加载时自动检查登录状态
    if (token) showAdminPanel();

    // ================= 资源站管理 =================
    function loadSites() {
        fetch(`${API_BASE}/api/admin/sites`, { headers: { 'x-admin-token': token } })
        .then(res => res.json())
        .then(sites => {
            const container = document.getElementById('site-list');
            const select = document.getElementById('collect-site-select');
            if (!sites.length) {
                container.innerHTML = '<p style="color: #888;">暂无资源站，请添加</p>';
                select.innerHTML = '<option value="">请先添加资源站</option>';
                return;
            }
            container.innerHTML = sites.map(site => `
                <div class="site-card">
                    <div class="site-info">
                        <strong>${site.name}</strong>
                        <small>${site.url} (${site.type.toUpperCase()})</small>
                    </div>
                    <div class="site-actions">
                        <button class="btn-secondary" onclick="openBindPanel('${site.id}')">绑定分类</button>
                        <button class="btn-danger" onclick="deleteSite('${site.id}')">删除</button>
                    </div>
                </div>
            `).join('');
            select.innerHTML = sites.map(site => `<option value="${site.id}">${site.name}</option>`).join('');
        });
    }

    function addSite() {
        const name = document.getElementById('site-name').value.trim();
        const url = document.getElementById('site-url').value.trim();
        const type = document.getElementById('site-type').value;
        if (!name || !url) return alert('请填写名称和接口地址');
        fetch(`${API_BASE}/api/admin/sites`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify({ name, url, type })
        })
        .then(res => res.json())
        .then(() => {
            loadSites();
            document.getElementById('site-name').value = '';
            document.getElementById('site-url').value = '';
        });
    }

    function deleteSite(id) {
        if (!confirm('确定删除该资源站？')) return;
        fetch(`${API_BASE}/api/admin/sites/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } })
        .then(() => loadSites());
    }

    // ================= 分类绑定 =================
    function openBindPanel(siteId) {
        currentBindSiteId = siteId;
        document.getElementById('bind-panel').classList.remove('hidden');
        const tbody = document.getElementById('bind-tbody');
        tbody.innerHTML = '<tr><td colspan="3">加载分类中...</td></tr>';

        fetch(`${API_BASE}/api/admin/sites/${siteId}/categories`, { headers: { 'x-admin-token': token } })
        .then(res => res.json())
        .then(categories => {
            if (!categories.length || categories.error) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: #dc3545;">未获取到分类，请检查接口地址是否正确 (${categories.error || ''})</td></tr>`;
                return;
            }
            tbody.innerHTML = categories.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td><input type="text" class="bind-input" data-source-id="${c.id}" data-source-name="${c.name}" placeholder="例如: 电影"></td>
                </tr>
            `).join('');
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="3" style="color: #dc3545;">获取分类失败，请检查资源站接口是否可用</td></tr>';
        });
    }

    function saveBindings() {
        const inputs = document.querySelectorAll('.bind-input');
        const mappings = [];
        inputs.forEach(input => {
            const local = input.value.trim();
            if (local) {
                mappings.push({
                    sourceId: input.dataset.sourceId,
                    sourceName: input.dataset.sourceName,
                    localCategory: local
                });
            }
        });
        if (!mappings.length) return alert('请至少绑定一个分类');
        fetch(`${API_BASE}/api/admin/sites/${currentBindSiteId}/bind`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify({ mappings })
        })
        .then(res => res.json())
        .then(() => {
            alert('分类绑定已保存！');
            closeBindPanel();
        });
    }

    function closeBindPanel() {
        document.getElementById('bind-panel').classList.add('hidden');
        currentBindSiteId = null;
    }

    // ================= 采集 =================
    function startCollect() {
        const siteId = document.getElementById('collect-site-select').value;
        if (!siteId) return alert('请先添加并选择资源站');

        const btn = document.getElementById('collect-btn');
        const status = document.getElementById('collect-status');
        const result = document.getElementById('collect-result');

        btn.disabled = true;
        status.textContent = '正在采集，请稍候...';
        result.textContent = '';

        fetch(`${API_BASE}/api/admin/collect/${siteId}`, { method: 'POST', headers: { 'x-admin-token': token } })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                result.textContent = '❌ 采集失败: ' + data.error;
            } else {
                result.textContent = `✅ ${data.message}`;
                loadVideos();
            }
        })
        .catch(err => {
            result.textContent = '❌ 请求失败: ' + err.message;
        })
        .finally(() => {
            btn.disabled = false;
            status.textContent = '';
        });
    }

    // ================= 已采集视频 =================
    function loadVideos() {
        fetch(`${API_BASE}/api/admin/videos`, { headers: { 'x-admin-token': token } })
        .then(res => res.json())
        .then(videos => {
            const container = document.getElementById('video-list');
            if (!videos.length) {
                container.innerHTML = '<p style="color: #888;">暂无已采集的视频</p>';
                return;
            }
            container.innerHTML = videos.slice(-20).reverse().map(v => `
                <div style="padding: 8px 0; border-bottom: 1px solid #f0f0f0;">
                    <strong>${v.name}</strong>
                    <span style="color: #888; margin-left: 10px;">分类: ${v.category}</span>
                </div>
            `).join('');
        });
    }
</script>

</body>
</html>
