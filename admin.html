<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS 管理后台</title>
    <style>
        :root { --primary: #ff6b9d; --bg: #f4f7f6; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; color: var(--primary); border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 20px; cursor: pointer; color: #aaa; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #2a2a2a; color: #fff; border-left-color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 30px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .tab { display: none; } .tab.active { display: block; }
        .card { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h3 { margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline:none; }
        button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; } .btn-danger { background: #dc3545; } .btn-text { background: none; color: #1890ff; padding: 0; font-size: 13px; margin-right: 10px;}
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index:999; }
        .modal-box { background: #fff; padding: 20px; width: 90%; max-width: 600px; border-radius: 8px; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 20px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
        .progress-bar-container { display: none; width: 100%; height: 12px; background: #eee; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CMS System</div>
        <div class="nav-item active" onclick="switchTab('tab-collect', this)">📥 采集视频</div>
        <div class="nav-item" onclick="switchTab('tab-config', this)">⚙️ 系统配置</div>
        <div class="nav-item" onclick="switchTab('tab-upload', this)">📤 视频上传管理</div>
        <div class="nav-item" onclick="switchTab('tab-i18n', this)">🌍 全局语言</div>
        <div class="nav-item" onclick="switchTab('tab-user', this)">👤 用户管理</div>
        <div class="nav-item" onclick="switchTab('tab-order', this)">💳 支付订单</div>
    </div>
    <div class="main">
        <div class="header"><h2 id="page-title">采集视频</h2><button class="btn-secondary" onclick="location.reload()">退出</button></div>
        <div class="content">
            
            <!-- 采集 -->
            <div id="tab-collect" class="tab active">
                <div class="card">
                    <h3>资源站列表</h3>
                    <div id="site-list"></div>
                    <div class="flex" style="margin-top:15px; background:#fafafa; padding:15px;">
                        <input type="text" id="site-name" placeholder="名称">
                        <input type="text" id="site-url" placeholder="接口地址" style="flex:1;">
                        <select id="site-type"><option value="json">JSON</option><option value="xml">XML</option></select>
                        <button onclick="addSite()">添加</button>
                    </div>
                </div>
                <div id="bind-panel" class="card" style="display:none;">
                    <h3>分类绑定 <button class="btn-secondary" onclick="document.getElementById('bind-panel').style.display='none'">关闭</button></h3>
                    <table><thead><tr><th>源分类</th><th>绑定到本地</th></tr></thead><tbody id="bind-tbody"></tbody></table>
                    <button style="margin-top:10px;" onclick="saveBindings()">保存绑定</button>
                </div>
                <div class="card">
                    <h3>执行采集</h3>
                    <div class="flex">
                        <select id="collect-site-select" style="width:300px;"></select>
                        <button onclick="startCollect()">一键采集</button>
                        <span id="collect-status" style="color:green;"></span>
                    </div>
                </div>
            </div>

            <!-- 系统配置 -->
            <div id="tab-config" class="tab">
                <div class="card">
                    <h3>基础设置</h3>
                    <div class="flex" style="margin-bottom:15px;">
                        <label>TRC20 接收地址：</label><input type="text" id="set-trc20" style="flex:1;">
                    </div>
                    <div class="flex" style="margin-bottom:15px;">
                        <label>首页精彩视频分类：</label><select id="set-hotCat"></select>
                    </div>
                    <div class="flex">
                        <label>首页直播推荐分类：</label><select id="set-recommendCat"></select>
                    </div>
                </div>
                <!-- 独立配置区块 -->
                <div class="flex" style="gap:20px; align-items: flex-start;">
                    <div class="card" style="flex:1;">
                        <h3>🔥 精彩视频 配置</h3>
                        <div class="flex" style="flex-direction:column; align-items:stretch; gap:10px;">
                            <label>未登录试看秒数：</label><input type="number" id="hot-preview" value="15">
                            <label>注册后试看秒数：</label><input type="number" id="hot-reg" value="120">
                            <label>解锁金额 (USDT)：</label><input type="number" id="hot-price" value="9.99">
                        </div>
                    </div>
                    <div class="card" style="flex:1;">
                        <h3>🔥 直播推荐 配置</h3>
                        <div class="flex" style="flex-direction:column; align-items:stretch; gap:10px;">
                            <label>未登录试看秒数：</label><input type="number" id="rec-preview" value="15">
                            <label>注册后试看秒数：</label><input type="number" id="rec-reg" value="120">
                            <label>解锁金额 (USDT)：</label><input type="number" id="rec-price" value="9.99">
                        </div>
                    </div>
                </div>
                <button onclick="saveSettings()" style="width:100%; padding:12px; font-size:16px;">保存所有配置</button>
            </div>

            <!-- 上传 -->
            <div id="tab-upload" class="tab">
                <div class="card">
                    <h3>批量上传</h3>
                    <div class="flex">
                        <input type="text" id="up-name" placeholder="前缀">
                        <select id="up-cat"></select>
                        <input type="file" id="up-file" accept="video/*" multiple>
                        <button onclick="uploadVideoBatch()">上传</button>
                    </div>
                    <div class="progress-bar-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                    <div class="progress-text" id="progress-text" style="display:none;"><span id="progress-status"></span><span id="progress-percent">0%</span></div>
                </div>
                <div class="card"><h3>视频列表</h3><table><tbody id="video-manage-list"></tbody></table></div>
            </div>

            <!-- 多语言 -->
            <div id="tab-i18n" class="tab">
                <div class="card">
                    <h3>DeepL API 设置</h3>
                    <div class="flex">
                        <input type="text" id="deepl-key" placeholder="输入 API Key" style="flex:1;">
                        <button onclick="saveKey()">保存</button>
                    </div>
                </div>
                <div class="card">
                    <h3>语言字典管理</h3>
                    <div class="flex" style="margin-bottom:15px;">
                        <select id="add-lang-select">
                            <option value="en">🇺🇸 English</option><option value="vn">🇻🇳 Tiếng Việt</option><option value="es">🇪🇸 Español</option><option value="tr">🇹🇷 Türkçe</option><option value="id">🇮🇩 Bahasa Indonesia</option>
                        </select>
                        <button onclick="addLanguage()">添加语言</button>
                    </div>
                    <table><thead><tr><th>语言</th><th>启用状态</th><th>操作</th></tr></thead><tbody id="lang-list"></tbody></table>
                </div>
            </div>

            <!-- 用户与订单 -->
            <div id="tab-user" class="tab"><div class="card"><h3>用户列表</h3><table><tbody id="user-list"></tbody></table></div></div>
            <div id="tab-order" class="tab"><div class="card"><h3>订单</h3><table><tbody id="order-list"></tbody></table></div></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3 id="edit-title">编辑字典</h3>
            <textarea id="edit-content" style="width:100%; height:300px; font-family:monospace;"></textarea>
            <div style="margin-top:15px; text-align:right;">
                <button class="btn-secondary" onclick="document.getElementById('edit-modal').style.display='none'">取消</button>
                <button onclick="saveDict()">保存</button>
            </div>
        </div>
    </div>

<script>
    const API = 'https://jiaoyouweb.onrender.com';
    const token = 'admin888';
    let editLang = '', bindSiteId = '';

    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.substring(2);
        if(id === 'tab-collect') loadCollectData();
        if(id === 'tab-config') loadConfig();
        if(id === 'tab-upload') loadVideoManage();
        if(id === 'tab-user') loadUsers();
        if(id === 'tab-i18n') loadLangs();
        if(id === 'tab-order') loadOrders();
    }

    // ========== 采集 ==========
    async function loadCollectData() {
        const sites = await (await fetch(`${API}/api/admin/sites`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('site-list').innerHTML = sites.map(s => `
            <div style="border:1px solid #eee; padding:10px; margin-bottom:10px; display:flex; justify-content:space-between;">
                <span>${s.name} (${s.url})</span>
                <div>
                    <button class="btn-secondary" onclick="openBind('${s.id}')">查看/绑定分类</button>
                    <button class="btn-danger" onclick="delSite('${s.id}')">删除</button>
                </div>
            </div>
        `).join('');
        document.getElementById('collect-site-select').innerHTML = sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }
    async function addSite() {
        await fetch(`${API}/api/admin/sites`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ name: document.getElementById('site-name').value, url: document.getElementById('site-url').value, type: document.getElementById('site-type').value }) });
        loadCollectData();
    }
    async function delSite(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/sites/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadCollectData(); }
    
    async function openBind(id) {
        bindSiteId = id; document.getElementById('bind-panel').style.display = 'block';
        const cats = await (await fetch(`${API}/api/admin/sites/${id}/categories`, { headers: { 'x-admin-token': token } })).json();
        const localCats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('bind-tbody').innerHTML = cats.map(c => `
            <tr>
                <td>${c.name} (${c.id})</td>
                <td><input type="hidden" class="bind-sid" value="${c.id}" data-name="${c.name}"><select class="bind-local">${localCats.map(lc => `<option value="${lc.name}">${lc.name}</option>`).join('')}</select></td>
            </tr>
        `).join('');
    }
    async function saveBindings() {
        const inputs = document.querySelectorAll('#bind-tbody tr');
        let mappings = [];
        inputs.forEach(tr => { mappings.push({ sourceId: tr.querySelector('.bind-sid').value, sourceName: tr.querySelector('.bind-sid').dataset.name, localCategory: tr.querySelector('.bind-local').value }); });
        await fetch(`${API}/api/admin/sites/${bindSiteId}/bind`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ mappings }) });
        alert('保存成功'); document.getElementById('bind-panel').style.display = 'none';
    }
    async function startCollect() {
        const id = document.getElementById('collect-site-select').value;
        document.getElementById('collect-status').innerText = '采集中...';
        const res = await fetch(`${API}/api/admin/collect/${id}`, { method: 'POST', headers: { 'x-admin-token': token } });
        alert((await res.json()).message); document.getElementById('collect-status').innerText = '';
    }

    // ========== 配置 ==========
    async function loadConfig() {
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('set-trc20').value = s.trc20 || '';
        let opts = '<option value="all">全部加载</option>' + cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        document.getElementById('set-hotCat').innerHTML = opts; document.getElementById('set-hotCat').value = s.hotCat || 'all';
        document.getElementById('set-recommendCat').innerHTML = opts; document.getElementById('set-recommendCat').value = s.recommendCat || 'all';

        document.getElementById('hot-preview').value = s.hotConfig?.previewLimit || 15;
        document.getElementById('hot-reg').value = s.hotConfig?.regLimit || 120;
        document.getElementById('hot-price').value = s.hotConfig?.unlockPrice || 9.99;

        document.getElementById('rec-preview').value = s.recommendConfig?.previewLimit || 15;
        document.getElementById('rec-reg').value = s.recommendConfig?.regLimit || 120;
        document.getElementById('rec-price').value = s.recommendConfig?.unlockPrice || 9.99;
    }
    async function saveSettings() {
        const data = {
            trc20: document.getElementById('set-trc20').value,
            hotCat: document.getElementById('set-hotCat').value,
            recommendCat: document.getElementById('set-recommendCat').value,
            hotConfig: {
                previewLimit: Number(document.getElementById('hot-preview').value),
                regLimit: Number(document.getElementById('hot-reg').value),
                unlockPrice: Number(document.getElementById('hot-price').value)
            },
            recommendConfig: {
                previewLimit: Number(document.getElementById('rec-preview').value),
                regLimit: Number(document.getElementById('rec-reg').value),
                unlockPrice: Number(document.getElementById('rec-price').value)
            }
        };
        await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify(data) });
        alert('保存成功');
    }

    // ========== 语言 ==========
    async function loadLangs() {
        const list = await (await fetch(`${API}/api/admin/i18n-list`, { headers: { 'x-admin-token': token } })).json();
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        const enabled = s.enabledLangs || ['zh'];
        document.getElementById('lang-list').innerHTML = list.map(lang => `
            <tr>
                <td>${lang}</td>
                <td><label class="switch"><input type="checkbox" ${enabled.includes(lang) ? 'checked' : ''} onchange="toggleLang('${lang}', this.checked)"><span class="slider"></span></label></td>
                <td>
                    <button class="btn-text" onclick="editLangData('${lang}')">编辑字典</button>
                    ${lang !== 'zh' ? `<button class="btn-text" onclick="translateLang('${lang}')">一键翻译</button>` : ''}
                    ${lang !== 'zh' ? `<button class="btn-danger" onclick="delLang('${lang}')">删除</button>` : ''}
                </td>
            </tr>
        `).join('');
    }
    async function toggleLang(lang, isEnabled) {
        const s = await (await fetch(`${API}/api/admin/settings`, { headers: { 'x-admin-token': token } })).json();
        let en = s.enabledLangs || ['zh'];
        if (isEnabled) { if(!en.includes(lang)) en.push(lang); } else { en = en.filter(x => x !== lang); }
        await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ enabledLangs: en }) });
    }
    async function addLanguage() {
        const lang = document.getElementById('add-lang-select').value;
        await fetch(`${API}/api/admin/i18n/${lang}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({}) });
        loadLangs();
    }
    async function delLang(lang) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/i18n/${lang}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadLangs(); }
    async function editLangData(lang) {
        editLang = lang; document.getElementById('edit-title').innerText = '编辑 ' + lang;
        document.getElementById('edit-content').value = '加载中...';
        document.getElementById('edit-modal').style.display = 'flex';
        const res = await fetch(`${API}/api/admin/i18n-content/${lang}`, { headers: { 'x-admin-token': token } });
        const data = await res.json();
        document.getElementById('edit-content').value = JSON.stringify(data, null, 2);
    }
    async function saveDict() {
        try {
            const data = JSON.parse(document.getElementById('edit-content').value);
            await fetch(`${API}/api/admin/i18n/${editLang}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify(data) });
            alert('保存成功'); document.getElementById('edit-modal').style.display = 'none';
        } catch (e) { alert('JSON 格式错误'); }
    }
    function saveKey() { localStorage.setItem('deepl_key', document.getElementById('deepl-key').value); alert('已保存'); }
    if(localStorage.getItem('deepl_key')) document.getElementById('deepl-key').value = localStorage.getItem('deepl_key');
    async function translateLang(lang) {
        const key = localStorage.getItem('deepl_key');
        if(!key) return alert('请先输入保存 API Key');
        if(!confirm(`确定用中文翻译 ${lang} 吗？`)) return;
        const res = await fetch(`${API}/api/admin/translate/${lang}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ apiKey: key }) });
        const d = await res.json();
        alert(d.message || d.error); loadLangs();
    }

    // ========== 视频与用户 ==========
    async function loadVideoManage() {
        const cats = await (await fetch(`${API}/api/admin/categories`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('up-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        const vids = await (await fetch(`${API}/api/admin/videos`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('video-manage-list').innerHTML = vids.map(v => `<tr><td>${v.name}</td><td>${v.category}</td><td><button class="btn-danger" onclick="delVideo('${v.id}')">删除</button></td></tr>`).join('');
    }
    async function uploadVideoBatch() {
        const files = document.getElementById('up-file').files;
        if(files.length === 0) return alert('请选择视频');
        const baseName = document.getElementById('up-name').value.trim();
        const category = document.getElementById('up-cat').value;
        const container = document.getElementById('progress-container'), bar = document.getElementById('progress-bar'), textContainer = document.getElementById('progress-text'), statusText = document.getElementById('progress-status'), percentText = document.getElementById('progress-percent');
        container.style.display = 'block'; textContainer.style.display = 'flex';
        let successCount = 0;
        for (let i = 0; i < files.length; i++) {
            const file = files[i]; const title = baseName ? `${baseName}_${i+1}` : file.name;
            statusText.innerText = `上传中 (${i+1}/${files.length}): ${title}`;
            try {
                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest(); const fd = new FormData();
                    fd.append('video', file); fd.append('name', title); fd.append('category', category);
                    xhr.open('POST', `${API}/api/admin/upload-video`, true); xhr.setRequestHeader('x-admin-token', token);
                    xhr.upload.onprogress = (e) => { if (e.lengthComputable) { const percent = Math.round(((i / files.length) * 100) + ((e.loaded / e.total) * (100 / files.length))); bar.style.width = percent + '%'; percentText.innerText = percent + '%'; } };
                    xhr.onload = () => { if (xhr.status === 200) resolve(); else reject(); };
                    xhr.onerror = () => reject(); xhr.send(fd);
                });
                successCount++;
            } catch(e) {}
        }
        statusText.innerText = `结束: 成功 ${successCount}/${files.length}`; bar.style.width = '100%'; percentText.innerText = '100%';
        setTimeout(() => { container.style.display = 'none'; textContainer.style.display = 'none'; bar.style.width = '0%'; }, 3000);
        document.getElementById('up-file').value = ''; loadVideoManage();
    }
    async function delVideo(id) { if(!confirm('删除?'))return; await fetch(`${API}/api/admin/videos/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } }); loadVideoManage(); }

    async function loadUsers() {
        const users = await (await fetch(`${API}/api/admin/users`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('user-list').innerHTML = users.map(u => `<tr><td>${u.email}</td><td>${u.name}</td><td>${u.balance || 0}</td></tr>`).join('');
    }
    async function loadOrders() {
        const o = await (await fetch(`${API}/api/admin/orders`, { headers: { 'x-admin-token': token } })).json();
        document.getElementById('order-list').innerHTML = o.map(x => `<tr><td>${x.id}</td><td>${x.amount}</td><td>${x.status}</td></tr>`).join('');
    }

    loadCollectData(); loadUsers();
</script>
</body>
</html>
