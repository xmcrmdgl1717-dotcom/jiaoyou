<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嗨呀直播</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  /* CSS 保持上一版不变，省略... */
  #video-limit-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; }
  #video-limit-overlay h3 { font-size: 20px; font-weight: 800; margin-bottom: 10px; color: #ff6b9d; }
  #video-limit-overlay p { font-size: 13px; opacity: 0.8; margin-bottom: 20px; }
  #video-limit-overlay button { background: linear-gradient(90deg, #ff9a4d, #ff4d94); color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .live-stats-bar { margin-top: 12px; background: linear-gradient(90deg, #fff5f9 0%, #ffeaf3 100%); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 20px rgba(255, 92, 157, 0.08); position: relative; overflow: hidden; }
  .live-avatars { display: flex; align-items: center; flex: none; }
  .live-avatars img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; margin-left: -10px; transition: opacity 0.3s; }
  .live-avatars img:first-child { margin-left: 0; }
  .live-content { flex: 1; min-width: 0; }
  .live-count { font-size: 13px; font-weight: 800; color: #ff3d8b; display: flex; align-items: center; gap: 4px; }
  .live-count span { font-size: 16px; color: #ff1a75; }
  .live-marquee { font-size: 10px; color: #9a9fb2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.3s; }
  .live-pulse-dot { width: 8px; height: 8px; background: #ff3d8b; border-radius: 50%; flex: none; box-shadow: 0 0 0 0 rgba(255, 61, 139, 0.7); animation: pulse-dot 1.5s infinite; }
  @keyframes pulse-dot { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 61, 139, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 61, 139, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 61, 139, 0); } }
</style>
</head>
<body>
<div class="page">
  <!-- 此处省略头部、Hero、Card等与上一版一致的内容，只展示修改点 -->
  <!-- 关键修改点：在线数据条 -->
  <div class="live-stats-bar">
    <div class="live-pulse-dot"></div>
    <div class="live-avatars" id="live-avatars">
      <img src="assets/img/ava/ava1.webp" alt="">
      <img src="assets/img/ava/ava2.webp" alt="">
      <img src="assets/img/ava/ava3.webp" alt="">
    </div>
    <div class="live-content">
      <!-- 使用 data-i18n-html 支持内部 span -->
      <div class="live-count" data-i18n-html="stats.online">🔥 当前 <span id="online-count">0</span> 人在线速配</div>
      <div class="live-marquee" id="live-marquee" data-i18n="stats.marquee">正在获取同城最新匹配动态...</div>
    </div>
  </div>

  <!-- 关键修改点：客服弹窗 -->
  <div class="modal-overlay" id="customer-modal" hidden style="display:none;">
    <div class="modal-dialog" style="background: #111; color: #fff; padding: 0; max-width: 380px;">
      <button class="modal-close" type="button" data-customer-close style="color: #fff;">×</button>
      <div style="height: 300px; background: url('https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=600&q=80') center/cover;"></div>
      <div style="padding: 20px; text-align: center;">
        <div id="customer-countdown-area">
          <h3 style="font-size: 20px; font-weight: 900; margin-bottom: 6px;" data-i18n="customer.title">深夜同城 专属1V1</h3>
          <p style="color: #ff6b9d; margin-bottom: 10px; font-size: 13px;" data-i18n="customer.desc">发现附近刚刚上线的心动女孩</p>
          <p style="color: #ff6b9d; margin-bottom: 10px;" data-i18n="customer.matching">正在为你匹配同城高颜值空姐/学生…</p>
          <div style="font-size: 42px; font-weight: 900; color: #ff6b9d;" id="customer-timer">15</div>
          <p style="font-size: 11px; opacity: 0.5; margin-top: 5px;" data-i18n="customer.seconds">秒后为你揭晓神秘联系方式</p>
        </div>
        <div id="customer-result-area" style="display: none;">
          <p style="font-weight: 700; margin-bottom: 6px;" data-i18n="customer.success">匹配成功！🎉</p>
          <p style="font-size: 12px; opacity: 0.6; margin-bottom: 16px;" data-i18n="customer.tip">添加 Telegram 专属客服，获取同城资源</p>
          <a href="https://t.me/yourusername" target="_blank" style="display:inline-block; background:linear-gradient(90deg, #ff6b9d, #ff3d8b); color:#fff; padding:12px 24px; border-radius:20px; text-decoration:none;" data-i18n="customer.btn">添加 Telegram 客服</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 关键修改点：视频播放器 -->
  <div class="modal-overlay" id="video-player-modal" hidden style="display:none; background: rgba(0,0,0,0.92); z-index: 200;">
    <div style="position: relative; width: 100%; max-width: 420px; height: 90vh; max-height: 750px; margin: auto; background: #000; border-radius: 16px; overflow: hidden;">
      <button id="video-close-btn" style="position: absolute; top: 16px; left: 16px; z-index: 30; background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;">×</button>
      <video id="video-player" controls autoplay playsinline style="width: 100%; height: 100%; object-fit: contain; background: #000;"></video>
      
      <div id="video-limit-overlay">
        <h3 data-i18n="video.limit.title">试看已结束</h3>
        <p data-i18n="video.limit.desc">注册登录后可无限畅看完整版视频</p>
        <button onclick="window.closeVideoPlayer(); window.openRegisterModal();" data-i18n="video.limit.btn">免费注册 / 登录</button>
      </div>

      <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 60px 20px 20px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.8)); color: #fff; pointer-events: none; z-index: 10;">
        <div style="font-size: 18px; font-weight: 700;" id="video-player-name"></div>
        <div style="font-size: 12px; opacity: 0.7;" id="video-player-meta"></div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/app.js" defer></script>
</body>
</html>
