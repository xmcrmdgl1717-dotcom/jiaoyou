<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嗨呀直播</title>
<link rel="stylesheet" href="assets/css/styles.css">
<!-- 移除旧的LaSDK，保持页面纯净 -->
</head>
<body>
<div class="page">
  <!-- ============ HERO WRAP ============ -->
  <div class="hero-wrap">
    <!-- nav -->
    <div class="nav">
      <div class="brand" data-register role="button" tabindex="0">
        <div class="brand-name g-pink" data-i18n="brand.name">嗨呀直播</div>
        <div class="brand-sub" data-i18n="nav.subtitle">同城交友 遇见心动</div>
      </div>
      <button class="nav-toggle" type="button" aria-label="菜单" aria-expanded="false" data-nav-toggle>☰</button>
      <div class="nav-links">
        <a class="active" data-i18n="nav.home">首页</a>
        <a data-i18n="nav.live" data-register role="button" tabindex="0">直播</a>
        <a data-i18n="nav.drama" data-register role="button" tabindex="0">AI剧场</a>
        <a data-i18n="nav.rank" data-register role="button" tabindex="0">排行榜</a>
        <a data-i18n="nav.community" data-register role="button" tabindex="0">社区</a>
        <a data-i18n="nav.benefits" data-register role="button" tabindex="0">福利中心</a>
        <a data-i18n="nav.more">更多</a>
      </div>
      <label class="lang" for="lang-select">
        <span aria-hidden="true">🌐</span>
        <select id="lang-select" data-lang-select aria-label="语言">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
        </select>
      </label>
      
      <!-- 动态渲染登录/用户菜单的区域 -->
      <div id="auth-area" style="display:flex;align-items:center;">
         <a class="login-btn" data-i18n="nav.login" data-register role="button" tabindex="0">登录 / 注册</a>
      </div>
    </div>
    <!-- ... 后续 hero, fbar, dual 等模块保持原样，无需修改 ... -->
    
    <!-- 热门推荐头部 -->
    <div class="sec-head">
      <div class="st" data-i18n="hot.title">🔥 同城推荐</div>
      <div class="more" id="hot-more-btn" data-i18n="hot.more" data-register role="button" tabindex="0">查看全部主播 ›</div>
    </div>
    <!-- ... 热门推荐卡片保持原样 ... -->
    
    <!-- ... 后续 steps, cta, footer 保持原样 ... -->

  </div>

  <!-- ============ 注册/登录 弹窗 ============ -->
  <div class="modal-overlay" id="register-modal" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal-dialog tabindex="-1">
      <button class="modal-close" type="button" data-modal-close aria-label="关闭" data-i18n="modal.close">关闭</button>

      <!-- 注册视图 -->
      <section class="modal-view" data-view="form">
        <h2 id="modal-title" data-i18n="modal.title">创建你的交友账号</h2>
        <form data-register-form novalidate>
          <label class="modal-field">
            <span data-i18n="modal.field.name">昵称</span>
            <input name="name" type="text" required minlength="2" maxlength="40" autocomplete="nickname">
            <small data-i18n="modal.field.name.hint">2–40 个字符</small>
          </label>
          <label class="modal-field">
            <span data-i18n="modal.field.email">邮箱</span>
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label class="modal-field">
            <span data-i18n="modal.field.password">密码</span>
            <input name="password" type="password" required minlength="8" autocomplete="new-password">
            <small data-i18n="modal.field.password.hint">至少 8 个字符</small>
          </label>
          <label class="modal-agree">
            <input name="agree" type="checkbox" required>
            <span>
              <span data-i18n="modal.field.agree.pre">我已阅读并同意</span>
              <a href="terms.html" target="_blank" rel="noopener" data-legal data-i18n="modal.field.agree.terms">使用条款</a>
              <span data-i18n="modal.field.agree.and">和</span>
              <a href="privacy.html" target="_blank" rel="noopener" data-legal data-i18n="modal.field.agree.privacy">隐私政策</a>
            </span>
          </label>
          <div class="modal-error" data-form-error style="display:none;color:#ff3d8b;font-size:12px;margin-bottom:10px;text-align:center;"></div>
          <button class="modal-submit" type="submit" data-i18n="modal.submit" data-default-zh="免费注册" data-default-en="Sign up free">免费注册</button>
        </form>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#9a9fb2;">
          已有账号？<a href="#" style="color:#ff3d8b;" onclick="event.preventDefault(); showLoginView();">直接登录</a>
        </p>
      </section>

      <!-- 登录视图 -->
      <section class="modal-view" data-view="login" hidden>
        <h2 data-i18n="modal.login.title">登录你的账号</h2>
        <form data-login-form novalidate>
          <label class="modal-field">
            <span data-i18n="modal.field.email">邮箱</span>
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label class="modal-field">
            <span data-i18n="modal.field.password">密码</span>
            <input name="password" type="password" required autocomplete="current-password">
          </label>
          <div class="modal-error" data-login-error style="display:none;color:#ff3d8b;font-size:12px;margin-bottom:10px;text-align:center;"></div>
          <button class="modal-submit" type="submit" data-i18n="modal.login.submit" data-default-zh="登录" data-default-en="Log in">登录</button>
        </form>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#9a9fb2;">
          还没有账号？<a href="#" style="color:#ff3d8b;" onclick="event.preventDefault(); showRegisterView();">立即注册</a>
        </p>
      </section>
      
      <!-- 欢迎视图 (登录/注册成功后显示) -->
      <section class="modal-view" data-view="welcome" hidden>
        <div class="modal-success" aria-hidden="true">✓</div>
        <h2 data-i18n="modal.welcome.title">欢迎回来！</h2>
        <p data-i18n="modal.welcome.desc">你已成功登录。</p>
        <button class="modal-submit" onclick="closeModal()" data-i18n="modal.welcome.cta">开始探索</button>
      </section>
    </div>
  </div>

  <script>
    // 在app.js加载前，先根据localStorage判断登录状态，渲染UI
    (function() {
      const savedUser = localStorage.getItem('hiya_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          const authArea = document.getElementById('auth-area');
          if (authArea) {
            authArea.innerHTML = `
              <div class="user-menu-wrapper" style="position:relative;">
                <div class="user-trigger" id="user-trigger" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:20px;transition:background 0.2s;">
                  <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=ff5c9d&color=fff&size=32&bold=true" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                  <span style="font-size:13px;font-weight:600;color:#2b2f5b;">${user.name}</span>
                  <span style="font-size:10px;color:#9a9fb2;">▼</span>
                </div>
                <div class="user-dropdown" id="user-dropdown" style="display:none;position:absolute;top:110%;right:0;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:8px;min-width:140px;z-index:50;">
                  <a href="#" style="display:block;padding:8px 12px;font-size:13px;color:#3a3f5f;border-radius:8px;" onmouseover="this.style.background='#fdf2f7'" onmouseout="this.style.background='transparent'">👤 个人中心</a>
                  <a href="#" id="logout-btn" style="display:block;padding:8px 12px;font-size:13px;color:#ff3d8b;border-radius:8px;" onmouseover="this.style.background='#fdf2f7'" onmouseout="this.style.background='transparent'">🚪 退出登录</a>
                </div>
              </div>
            `;
            // 绑定下拉菜单事件
            const trigger = document.getElementById('user-trigger');
            const dropdown = document.getElementById('user-dropdown');
            trigger.addEventListener('click', (e) => {
              e.stopPropagation();
              dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            });
            document.addEventListener('click', () => { if (dropdown) dropdown.style.display = 'none'; });
            
            // 退出登录事件
            document.getElementById('logout-btn').addEventListener('click', (e) => {
              e.preventDefault();
              localStorage.removeItem('hiya_user');
              window.location.reload();
            });
          }
        } catch(e) { console.error(e); }
      }
    })();
  </script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
